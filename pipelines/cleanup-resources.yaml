kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: cleanup-resources
spec:
  description: |
    Cleanup pipeline that finds and destroys old mapt resources, AWS AMIs, and Azure images.
    Uses matrix feature to parallelize cleanup of multiple resources.
  params:
    - name: image-name-filters
      description: List of substrings that must ALL be present in cloud image names to be considered for cleanup (applies to both AWS AMIs and Azure images, e.g., ["rhel-ai", "-pr-"] will only match images containing both substrings)
      type: array
      default:
        - "rhel-ai"
        - "-pr-"
    - name: debug
      default: "false"
    - name: dry-run
      description: If "true", only log actions without executing cleanup
      default: "false"
    - name: force-destroy
      description: If "true", force the destruction of resources even if there is a lock
      default: "false"
    - name: secret-aws-credentials
      description: Name of the secret containing AWS credentials
      default: "aws-creds"
    - name: secret-az-credentials
      description: Name of the secret containing Azure credentials
      default: "secret-az-credentials"
    - name: ttl-hours-amis
      description: Time-to-live in hours for merge request AMIs before pruning (e.g., "72" for 3 days)
      default: "72"
    - name: ttl-hours-azure-images
      description: Time-to-live in hours for Azure test images before pruning (e.g., "72" for 3 days)
      default: "72"
    - name: ttl-hours-vms
      description: Time-to-live in hours for resources before pruning (e.g., "48" for 2 days)
      default: "48"
    - name: send-slack-notification
      default: "true"
    - name: slack-key-name
      description: Key within the slack-webhook secret for the webhook URL
      default: "rhel-ai-notification"
  tasks:
    - name: find-resources
      description: Scan S3 and Azure Blob Storage for old resources
      params:
        - name: image-name-filters
          value:
            - $(params.image-name-filters[*])
        - name: dry-run
          value: $(params.dry-run)
        - name: secret-aws-credentials
          value: $(params.secret-aws-credentials)
        - name: secret-az-credentials
          value: $(params.secret-az-credentials)
        - name: ttl-hours-amis
          value: $(params.ttl-hours-amis)
        - name: ttl-hours-azure-images
          value: $(params.ttl-hours-azure-images)
        - name: ttl-hours-vms
          value: $(params.ttl-hours-vms)
      taskRef:
        resolver: git
        params:
          - name: org
            value: redhat
          - name: repo
            value: rhel-ai/konflux-data
          - name: scmType
            value: gitlab
          - name: serverURL
            value: https://gitlab.com
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/find-resources-to-prune.yaml
          - name: token
            value: gitlab-konflux-data-ro
          - name: tokenKey
            value: password
    - name: cleanup-rhel-resources
      params:
        - name: debug
          value: $(params.debug)
        - name: force-destroy
          value: $(params.force-destroy)
        - name: operation
          value: "destroy"
        - name: secret-aws-credentials
          value: $(params.secret-aws-credentials)
      matrix:
        params:
          - name: id
            value: $(tasks.find-resources.results.rhel-resources[*])
      runAfter:
        - find-resources
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/redhat-developer/mapt"
          - name: revision
            value: "v0.14.0"
          - name: pathInRepo
            value: "tkn/infra-aws-rhel.yaml"
      when:
        - input: $(tasks.find-resources.results.rhel-resources)
          operator: notin
          values: ["[]"]
        - input: $(params.dry-run)
          operator: in
          values: ["false"]
    - name: cleanup-rhel-ai-resources
      params:
        - name: debug
          value: $(params.debug)
        - name: force-destroy
          value: $(params.force-destroy)
        - name: operation
          value: "destroy"
        - name: secret-aws-credentials
          value: $(params.secret-aws-credentials)
      matrix:
        params:
          - name: id
            value: $(tasks.find-resources.results.rhel-ai-resources[*])
      runAfter:
        - find-resources
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/redhat-developer/mapt"
          - name: revision
            value: "v0.14.0"
          - name: pathInRepo
            value: "tkn/infra-aws-rhel-ai.yaml"
      when:
        - input: $(tasks.find-resources.results.rhel-ai-resources)
          operator: notin
          values: ["[]"]
        - input: $(params.dry-run)
          operator: in
          values: ["false"]
    - name: cleanup-fedora-resources
      params:
        - name: debug
          value: $(params.debug)
        - name: force-destroy
          value: $(params.force-destroy)
        - name: operation
          value: "destroy"
        - name: secret-aws-credentials
          value: $(params.secret-aws-credentials)
      matrix:
        params:
          - name: id
            value: $(tasks.find-resources.results.fedora-resources[*])
      runAfter:
        - find-resources
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/redhat-developer/mapt"
          - name: revision
            value: "v0.14.0"
          - name: pathInRepo
            value: "tkn/infra-aws-fedora.yaml"
      when:
        - input: $(tasks.find-resources.results.fedora-resources)
          operator: notin
          values: ["[]"]
        - input: $(params.dry-run)
          operator: in
          values: ["false"]
    - name: cleanup-aws-amis
      params:
        - name: debug
          value: $(params.debug)
        - name: force-destroy
          value: $(params.force-destroy)
        - name: operation
          value: "destroy"
        - name: secret-aws-credentials
          value: $(params.secret-aws-credentials)
      matrix:
        params:
          - name: id
            value: $(tasks.find-resources.results.aws-cloud-importer-resources[*])
      runAfter:
        - find-resources
      taskRef:
        resolver: http
        params:
          - name: url
            value: "https://raw.githubusercontent.com/mapt-oss/cloud-importer/refs/tags/v0.0.3/tkn/rhelai-aws.yaml"
      when:
        - input: $(tasks.find-resources.results.aws-cloud-importer-resources)
          operator: notin
          values: ["[]"]
        - input: $(params.dry-run)
          operator: in
          values: ["false"]
    - name: cleanup-azure-images
      params:
        - name: debug
          value: $(params.debug)
        - name: force-destroy
          value: $(params.force-destroy)
        - name: operation
          value: "destroy"
        - name: secret-az-credentials
          value: $(params.secret-az-credentials)
      matrix:
        params:
          - name: id
            value: $(tasks.find-resources.results.azure-cloud-importer-resources[*])
      runAfter:
        - find-resources
      taskRef:
        resolver: http
        params:
          - name: url
            value: "https://raw.githubusercontent.com/mapt-oss/cloud-importer/refs/tags/v0.0.3/tkn/rhelai-azure.yaml"
      when:
        - input: $(tasks.find-resources.results.azure-cloud-importer-resources)
          operator: notin
          values: ["[]"]
        - input: $(params.dry-run)
          operator: in
          values: ["false"]
  finally:
    - name: pipeline-failure-notification
      when:
        - input: $(tasks.status)
          operator: in
          values: ["Failed"]
        - input: $(params.send-slack-notification)
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: org
            value: redhat
          - name: repo
            value: rhel-ai/konflux-data
          - name: scmType
            value: gitlab
          - name: serverURL
            value: https://gitlab.com
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/konflux-pipeline-failure-notification.yaml
          - name: token
            value: gitlab-konflux-data-ro
          - name: tokenKey
            value: password
      params:
        - name: prompt
          value: |
            PipelineRun $(context.pipelineRun.name) in namespace $(context.pipelineRun.namespace) has failed.
            Troubleshoot the failure using kubectl to inspect the PipelineRun status, TaskRun conditions, and pod logs.
            Write a 1-2 sentence root cause summary to /home/claudio/output/output.txt.
        - name: header
          value: "Cleanup Resources Pipeline Failed"
        - name: slack-key-name
          value: $(params.slack-key-name)
        - name: pipeline-name
          value: $(context.pipelineRun.name)
        - name: pipeline-namespace
          value: $(context.pipelineRun.namespace)
        - name: git-resolver-token-secret
          value: gitlab-konflux-data-ro
