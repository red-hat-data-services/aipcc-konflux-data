kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: upload-rhel-ai-disk-image
spec:
  params:
    - name: accelerator
      default: "cuda"
      description: "Accelerator type for image naming (cuda, rocm)"
    - name: cloud-provider
      default: "aws"
      description: "Target cloud provider (aws, azure)"
    - name: container-image
      description: |
        Full reference to the OCI artifact containing the disk image, e.g.
        quay.io/redhat-user-workloads/rhel-ai-tenant/rhelai-bootc-3-2/bootc-cuda-aws-disk-image-3-2@sha256:b1c8752fbe49c574f46bade651bd00a3c1c5de48bb16c44a6563bf35a31f2002
    - name: helper-vm-architecture
      default: "x86_64"
      description: Architecture for the helper VM that pulls the disk-image artifact (x86_64 or arm64). Defaults to x86_64; use arm64 only when the artifact has an arm64 manifest.
    - name: pull-secret-name
      description: Name of the pull secret to use for pulling the container image
      default: "rhelai-bootc-3-2-pull"
    - name: rhel-ai-version
      description: RHEL AI version for image naming, e.g. 3.2.0
    - name: debug
      default: "false"
    - name: base-tags
      default: "konflux=true,ci=true,component=rhel-ai-disk-image,product=rhel-ai,app-code=RHAI-014,service-phase=dev,cost-center=722"
      description: Base cloud resource tags for cost tracking and resource identification
  results:
    - name: image-name
      value: $(tasks.check-cloud-image-exists.results.image-name)
  tasks:
    - name: check-cloud-image-exists
      description: Check if release cloud image already exists
      params:
        - name: cloud-provider
          value: "$(params.cloud-provider)"
        - name: release-mode
          value: "true"
        - name: rhel-ai-version
          value: "$(params.rhel-ai-version)"
        - name: secret-aws-credentials
          value: "aws-konflux-tests"
        - name: secret-az-credentials
          value: "secret-az-credentials"
        - name: variant
          value: "$(params.accelerator)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/red-hat-data-services/aipcc-konflux-data"
          - name: revision
            value: "main"
          - name: pathInRepo
            value: "tasks/check-cloud-image-exists.yaml"
    - name: create-helper-vm-aws
      description: Create AWS helper VM instance for extracting and uploading disk image
      params:
        - name: arch
          value: "$(params.helper-vm-architecture)"
        - name: cpus
          value: "2"
        - name: debug
          value: "$(params.debug)"
        - name: id
          value: "$(context.pipelineRun.name)-helper"
        - name: host-access-secret-name
          value: "mapt-helper-$(context.pipelineRun.name)"
        - name: memory
          value: "2"
        - name: operation
          value: "create"
        - name: ownerKind
          value: "PipelineRun"
        - name: ownerName
          value: "$(context.pipelineRun.name)"
        - name: ownerUid
          value: "$(context.pipelineRun.uid)"
        - name: secret-aws-credentials
          value: "aws-konflux-tests"
        - name: spot
          value: "false"
        - name: tags
          value: "$(params.base-tags),purpose=helper"
        - name: version
          value: "43"
      runAfter:
        - check-cloud-image-exists
      when:
        - input: $(tasks.check-cloud-image-exists.results.image-exists)
          operator: in
          values: ["false"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/redhat-developer/mapt"
          - name: revision
            value: "v0.14.5"
          - name: pathInRepo
            value: "tkn/infra-aws-fedora.yaml"
    - name: extract-and-upload-cloud-image
      description: Extract disk image from OCI artifact and upload to target cloud
      params:
        - name: cloud-provider
          value: "$(params.cloud-provider)"
        - name: container-image
          value: "$(params.container-image)"
        - name: debug
          value: "$(params.debug)"
        - name: host-access-secret-name
          value: "$(tasks.create-helper-vm-aws.results.host-access-secret)"
        - name: image-name
          value: "$(tasks.check-cloud-image-exists.results.image-name)"
        - name: pull-secret-name
          value: "$(params.pull-secret-name)"
        - name: secret-aws-credentials
          value: "aws-konflux-tests"
        - name: secret-az-credentials
          value: "secret-az-credentials"
        - name: tags
          value: "$(params.base-tags)"
      runAfter:
        - create-helper-vm-aws
      when:
        - input: $(tasks.check-cloud-image-exists.results.image-exists)
          operator: in
          values: ["false"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/red-hat-data-services/aipcc-konflux-data"
          - name: revision
            value: "main"
          - name: pathInRepo
            value: "tasks/extract-and-upload-cloud-image.yaml"
  finally:
    - name: delete-helper-vm-aws
      description: Clean up the AWS helper VM instance
      params:
        - name: id
          value: "$(context.pipelineRun.name)-helper"
        - name: operation
          value: "destroy"
        - name: secret-aws-credentials
          value: "aws-konflux-tests"
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/redhat-developer/mapt"
          - name: revision
            value: "v0.14.5"
          - name: pathInRepo
            value: "tkn/infra-aws-fedora.yaml"
      when:
        - input: $(tasks.check-cloud-image-exists.results.image-exists)
          operator: in
          values: ["false"]
