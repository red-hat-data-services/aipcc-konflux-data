kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: check-clair-cves-its
spec:
  description: |
    Integration Test Scenario pipeline that reports the CVEs which would be flagged by
    the Conforma cve.cve_blockers release gate, on the component that triggered it.

    The build-time clair-scan task only shows SCAN_OUTPUT in the UI. Its conftest filter
    drops any CVE whose fix status and RHSA link disagree, so a Python or Go ecosystem
    CVE (GHSA-*, PYSEC-*) with an upstream fix is left out of that count and a build can
    look clean while Conforma sees real vulnerabilities. This pipeline reads the complete
    Clair REPORTS blob attached to the built image and reports on it directly.

    Severity thresholds mirror the Conforma rule data keys restrict_cve_security_levels
    and restrict_unpatched_cve_security_levels, and default to the stock values. If an
    ECP overrides that rule data, set patched-severities and unpatched-severities to the
    same lists. cve_leeway cannot be mirrored, so a CVE still inside its grace period is
    reported here before it starts blocking.

    Tekton caps the combined size of a task's results, so the results carry counts only.
    The CVE identifiers are in the check-clair-cves task log.

  params:
    - name: SNAPSHOT
      description: Snapshot spec JSON (automatically provided by the ITS)
      type: string
    - name: patched-severities
      type: string
      description: |
        Severities to report for CVEs that have a fix, mirroring the Conforma rule data
        key restrict_cve_security_levels. Comma-separated: Critical, High, Medium, Low,
        Negligible, Unknown.
      default: "Critical,High"
    - name: unpatched-severities
      type: string
      description: |
        Severities to report for CVEs with no known fix, mirroring the Conforma rule data
        key restrict_unpatched_cve_security_levels. Empty by default, matching the stock
        rule data, where unpatched CVEs warn but do not block.
      default: ""
    - name: cve-leeway
      type: string
      description: |
        Grace period in days per severity, mirroring the Conforma rule data key
        cve_leeway. Measured from the CVE's disclosure date. The default matches
        rhtap-ec-policy, the policy data used by the ai-tenant ECPs.
      default: "Critical=6,High=29"
    - name: enforce
      type: string
      description: |
        If "true", matching CVEs set TEST_OUTPUT.result to FAILURE. If "false", they set
        it to WARNING.
      default: "false"
    - name: pull-secret-name
      type: string
      description: Dockerconfig secret used to read the image, its attestation, and the REPORTS blobs.
      default: "components-namespace-pull"
  results:
    - name: TEST_OUTPUT
      description: Konflux standardized test output.
      value: $(tasks.check-clair-cves.results.TEST_OUTPUT)
    - name: CVE_COUNT
      description: Number of unique matching CVEs.
      value: $(tasks.check-clair-cves.results.CVE_COUNT)
    - name: CVE_SUMMARY
      description: Per-severity counts of matching CVEs.
      value: $(tasks.check-clair-cves.results.CVE_SUMMARY)
    - name: SCANNED_IMAGE
      description: The image reference that was scanned.
      value: $(tasks.check-clair-cves.results.SCANNED_IMAGE)
  tasks:
    - name: check-clair-cves
      timeout: "15m"
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: patched-severities
          value: $(params.patched-severities)
        - name: unpatched-severities
          value: $(params.unpatched-severities)
        - name: cve-leeway
          value: $(params.cve-leeway)
        - name: enforce
          value: $(params.enforce)
        - name: pull-secret-name
          value: $(params.pull-secret-name)
      taskRef:
        resolver: git
        params:
          - name: org
            value: redhat
          - name: repo
            value: rhel-ai/konflux-data
          - name: scmType
            value: gitlab
          - name: serverURL
            value: https://gitlab.com
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/check-clair-cves.yaml
          - name: token
            value: pipelines-as-code-secret
          - name: tokenKey
            value: password
