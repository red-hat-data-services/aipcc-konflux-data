apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: modelcar-build
spec:
  params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
    - name: aws-secret-name
      description: Name of a secret which will be made available to the build as an Authorization header
      type: string
      default: "also-to-be-defined-in-task"
    - name: bearer-token-secret-name
      description: Name of a secret which will be made available to the build as an Authorization header
      type: string
      default: "does-not-exist"
    - default: "false"
      description: Skip checks against built image
      name: skip-checks
      type: string
    - default: "false"
      description: Force rebuild image
      name: rebuild
      type: string
    - name: base-image-reference
      type: string
      description: base image to use for the ModelCar
      default: registry.access.redhat.com/ubi9/ubi-micro:9.5-1741626669@sha256:63949c93d85abc5385985722c8fe9518782ff280828fc9b283419e4c0fdf05c2
    - name: model-artifact-reference
      description: model OCI artifact reference, resolved to digest
      type: string
    - name: modelcard-path
      description:
      type: string
      default: source/README.md
    - name: remove-originals
      description:
      type: string
      default: "true"
    - name: model-image-auth
      description: Secret to pull model image
      type: string
  results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-image.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-image.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
  tasks:
    - name: init
      params:
        - name: image-url
          value: $(params.output-image)
        - name: rebuild
          value: $(params.rebuild)
        - name: skip-checks
          value: $(params.skip-checks)
      taskRef:
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.2@sha256:66e90d31e1386bf516fb548cd3e3f0082b5d0234b8b90dbf9e0d4684b70dbe1a
          - name: kind
            value: task
        resolver: bundles
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: depth
          value: 10
        - name: enableSymlinkCheck
          value: false
        - name: ociStorage
          value: $(params.output-image).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      runAfter:
        - init
      taskRef:
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.1@sha256:8ecf57d5a6697ce709bee65b62781efe79a10b0c2b95e05576442b67fbd61744
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values:
            - "true"
      workspaces:
        - name: basic-auth
          workspace: git-auth
    - name: build-image
      timeout: "10h0m00s"
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: BASE_IMAGE
          value: $(params.base-image-reference)
        - name: MODEL_IMAGE
          value: $(params.model-artifact-reference)
        - name: MODEL_IMAGE_AUTH
          value: $(params.model-image-auth)
        - name: MODELCARD_PATH
          value: $(params.modelcard-path)
        - name: REMOVE_ORIGINALS
          value: $(params.remove-originals)
      runAfter:
        - clone-repository
      taskRef:
        params:
          - name: name
            value: modelcar-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-modelcar-oci-ta:0.1@sha256:d2dd19dffc49ba9634c6194ef3ad5304c62a218d008f7fd007b9737179825638
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values:
            - "true"
    - name: sast-snyk-check
      timeout: 2h
      params:
        - name: image-url
          value: $(tasks.build-image.results.IMAGE_URL)
        - name: image-digest
          value: $(tasks.build-image.results.IMAGE_DIGEST)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
      runAfter:
        - build-image
      taskRef:
        params:
          - name: name
            value: sast-snyk-check-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check-oci-ta:0.4@sha256:9a6ec5575f80668552d861e64414e736c85af772c272ca653a6fd1ec841d2627
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.skip-checks)
          operator: in
          values:
            - "false"
    - name: apply-tags
      params:
        - name: IMAGE
          value: $(tasks.build-image.results.IMAGE_URL)
      runAfter:
        - build-image
      taskRef:
        params:
          - name: name
            value: apply-tags
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.1@sha256:1c6f673fe100a49f58aaef62580c8adf0c397790964f4e7bac7fcd3f4d07c92e
          - name: kind
            value: task
        resolver: bundles
  workspaces:
    - name: git-auth
      optional: true

