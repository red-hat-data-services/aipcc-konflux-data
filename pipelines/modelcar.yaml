apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: modelcar-build
spec:
  params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
    - name: aws-secret-name
      description: Name of a secret which will be made available to the build as an Authorization header
      type: string
      default: "also-to-be-defined-in-task"
    - name: bearer-token-secret-name
      description: Name of a secret which will be made available to the build as an Authorization header
      type: string
      default: "does-not-exist"
    - default: "false"
      description: Skip checks against built image
      name: skip-checks
      type: string
    - default: "false"
      description: Force rebuild image
      name: rebuild
      type: string
    - name: base-image-reference
      type: string
      description: base image to use for the ModelCar
      default: registry.access.redhat.com/ubi9/ubi-micro:9.5-1741626669@sha256:63949c93d85abc5385985722c8fe9518782ff280828fc9b283419e4c0fdf05c2
    - name: model-artifact-reference
      description: model OCI artifact reference, resolved to digest
      type: string
    - name: modelcard-path
      description:
      type: string
      default: source/README.md
    - name: additional-pull-secret
      description: Additional secret to use while building
      type: string
      default: ""
  results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-image.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-image.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
  tasks:
    - name: init
      params:
        - name: image-url
          value: $(params.output-image)
        - name: rebuild
          value: $(params.rebuild)
        - name: skip-checks
          value: $(params.skip-checks)
      taskRef:
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.2@sha256:2f59e9a3c20ce4509356389d327087213cc82c079b30811935837791da140f9f
          - name: kind
            value: task
        resolver: bundles
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: depth
          value: 10
        - name: enableSymlinkCheck
          value: false
        - name: ociStorage
          value: $(params.output-image).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      runAfter:
        - init
      taskRef:
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.1@sha256:9709088bf3c581d4763e9804d9ee3a1f06ad6a61c23237277057c4f0cdc4f9c3
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values:
            - "true"
      workspaces:
        - name: basic-auth
          workspace: git-auth
    - name: build-image
      timeout: "4h0m00s"
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: BASE_IMAGE
          value: $(params.base-image-reference)
        - name: MODEL_IMAGE
          value: $(params.model-artifact-reference)
        - name: ADDITIONAL_SECRET
          value: $(params.additional-pull-secret)
        - name: MODELCARD_PATH
          value: $(params.modelcard-path)
      runAfter:
        - clone-repository
# TODO: replace with taskRef once build-modelcar-oci-ta is in the catalog
# TODO: JIRA ref goes here
#      taskRef:
#        params:
#          - name: name
#            value: oci-copy-oci-ta
#          - name: bundle
#            value: quay.io/konflux-ci/tekton-catalog/task-oci-copy-oci-ta:0.2@sha256:e41296f38a91682f48efb6ed7328555b7029eab334b38963860d756b1b0b9277
#          - name: kind
#            value: task
#        resolver: bundles
      taskSpec:
        description: Given a base image and a OCI artifact reference with the model files, builds a ModelCar image.
        params:
          - name: ADDITIONAL_SECRET
            default: does-not-exist
            description: Name of a secret which will be made available to the build with 'buildah
              build --secret' at /run/secrets/$ADDITIONAL_SECRET
            type: string
          - name: IMAGE
            description: Reference of the image we will push
            type: string
          - name: SBOM_TYPE
            description: 'Select the SBOM format to generate. Valid values: spdx,
              cyclonedx.'
            type: string
            default: spdx
          - name: SOURCE_ARTIFACT
            description: The Trusted Artifact URI pointing to the artifact with
              the application source code.
            type: string
          - name: BASE_IMAGE
            description: base image used to build the Modelcar image
            type: string
          - name: MODEL_IMAGE
            description: OCI artifact reference with the model files
            type: string
          - name: MODELCARD_PATH
            description: path to the Model Card
            type: string
        results:
          - name: IMAGE_DIGEST
            description: Digest of the artifact just pushed
          - name: IMAGE_REF
            description: Image reference of the built image
          - name: IMAGE_URL
            description: Repository where the artifact was pushed
          - name: SBOM_BLOB_URL
            description: Link to the SBOM blob pushed to the registry.
        volumes:
          - name: varlibcontainers
            emptyDir: { }
          - name: workdir
            emptyDir: { }
          - name: additional-secret
            secret:
              optional: true
              secretName: $(params.ADDITIONAL_SECRET)
          - name: shared
            emptyDir: { }
          - name: trusted-ca
            configMap:
              items:
                - key: $(params.caTrustConfigMapKey)
                  path: ca-bundle.crt
              name: $(params.caTrustConfigMapName)
              optional: true
        stepTemplate:
          env:
            - name: IMAGE
              value: $(params.IMAGE)
            - name: SBOM_TYPE
              value: $(params.SBOM_TYPE)
            - name: BASE_IMAGE
              value: $(params.BASE_IMAGE)
            - name: MODEL_IMAGE
              value: $(params.MODEL_IMAGE)
            - name: TARGET_OCI
              value: "/var/workdir/modelcar-oci"
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
        steps:
          - name: use-trusted-artifact
            image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:ff35e09ff5c89e54538b50abae241a765b2b7868f05d62c4835bebf0978f3659
            args:
              - use
              - $(params.SOURCE_ARTIFACT)=/var/workdir/source
          - name: download-models
            image: quay.io/konflux-ci/oras:latest@sha256:c68c23fe7bb1ba9fc335192761ea94fc2c9beb701f3c205890581ff62fd38d80
            volumeMounts:
              - mountPath: /additional-secret
                name: additional-secret
            workingDir: /var/workdir
            script: |
              #!/bin/bash
              set -eu
              set -o pipefail

              oras pull "$MODEL_IMAGE" \
                --registry-config /additional-secret/.dockerconfigjson --output /var/workdir/models
          - name: create-modelcar-base-image
            image: quay.io/konflux-ci/release-service-utils:2f93b7ed6a2099e7187bb110a6b95caac3b8bdbc
            workingDir: /var/workdir
            script: |
              #!/bin/bash
              set -eu
              set -o pipefail              
              oras copy --to-oci-layout "$BASE_IMAGE" "${TARGET_OCI}:latest"
              chmod -R g+w "$TARGET_OCI"

          - name: copy-model-files
            image: registry.access.redhat.com/ubi9/python-311:9.5-1741020859
            workingDir: /var/workdir
            env:
              - name: OLOT_VERSION
                value: 0.1.4
              - name: MODELCARD_PATH
                value: $(params.MODELCARD_PATH)
            script: |
              #!/bin/bash
              set -eu
              set -o pipefail

              pip install olot==${OLOT_VERSION}
              olot -m "$MODELCARD_PATH" "$TARGET_OCI" models/*

          - name: push-image
            image: quay.io/konflux-ci/oras:latest@sha256:c68c23fe7bb1ba9fc335192761ea94fc2c9beb701f3c205890581ff62fd38d80
            workingDir: /var/workdir
            script: |
              #!/bin/bash
              set -eu
              set -o pipefail

              select-oci-auth "$IMAGE" >auth.json

              echo "Pushing complete artifact manifest to ${IMAGE}"
              oras cp --to-registry-config auth.json --from-oci-layout "${TARGET_OCI}:latest" "$IMAGE"

              echo "Push complete!"
              RESULTING_DIGEST=$(oras resolve --registry-config auth.json "${IMAGE}")
              echo -n "$RESULTING_DIGEST" | tee "$(results.IMAGE_DIGEST.path)"
              echo
              echo -n "$IMAGE" | tee "$(results.IMAGE_URL.path)"
              echo
              echo -n "${IMAGE}@${RESULTING_DIGEST}" >"$(results.IMAGE_REF.path)"

          - name: sbom-generate
#              image: quay.io/konflux-ci/sbom-utility-scripts@sha256:1939901046f2ec0afda6d48f32dc82f991d9a4e2b4b4513635b9c79e3d4c2872
            image: quay.io/vmugicag/build-tasks-dockerfiles@sha256:3517aa79f162775e3142a1f94c3b1aa49c5ee8b4e102eb1cc146811db26a3337
            workingDir: /var/workdir
            script: |                      
              #!/bin/bash
              set -euo pipefail

              MODELCAR_IMAGE=$(cat "$(results.IMAGE_REF.path)")

              python3 /scripts/sbom_for_modelcar_task.py \
              --sbom-type "$SBOM_TYPE" \
              --modelcar-image "$MODELCAR_IMAGE" \
              --base-image "$BASE_IMAGE" \
              --model-image "$MODEL_IMAGE" \
              --output-file sbom.json \

              #TODO: remove debug:
              cat sbom.json

          - name: upload-sbom
            image: quay.io/konflux-ci/appstudio-utils:48c311af02858e2422d6229600e9959e496ddef1@sha256:91ddd999271f65d8ec8487b10f3dd378f81aa894e11b9af4d10639fd52bba7e8
            workingDir: /var/workdir
            script: |
              cosign attach sbom --sbom sbom.json --type "$SBOM_TYPE" "$(cat "$(results.IMAGE_REF.path)")"
          - name: report-sbom-url
            image: quay.io/konflux-ci/yq:latest@sha256:93bb15cff64b708263055a5814b24a0b450d8724b86a7e5206396f25d81fcc21
            workingDir: /var/workdir
            script: |
              #!/bin/bash
              REPO=${IMAGE%:*}
              echo "Found that ${REPO} is the repository for ${IMAGE}"
              SBOM_DIGEST=$(sha256sum sbom.json | awk '{ print $1 }')
              echo "Found that ${SBOM_DIGEST} is the SBOM digest"
              echo -n "${REPO}@sha256:${SBOM_DIGEST}" | tee $(results.SBOM_BLOB_URL.path)
      when:
        - input: $(tasks.init.results.build)
          operator: in
          values:
            - "true"
    - name: sast-snyk-check
      timeout: 2h
      params:
        - name: image-url
          value: $(tasks.build-image.results.IMAGE_URL)
        - name: image-digest
          value: $(tasks.build-image.results.IMAGE_DIGEST)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
      runAfter:
        - build-image
      taskRef:
        params:
          - name: name
            value: sast-snyk-check-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check-oci-ta:0.3@sha256:540f585f8abc3790e9e1285330d5610c1101173d9b26a61924586c220e4024e6
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.skip-checks)
          operator: in
          values:
            - "false"
    - name: apply-tags
      params:
        - name: IMAGE
          value: $(tasks.build-image.results.IMAGE_URL)
      runAfter:
        - build-image
      taskRef:
        params:
          - name: name
            value: apply-tags
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.1@sha256:e1d365ce85d6448f6ebd0d0a000d0f45b694950b7545a2c34bfbcf992c80df61
          - name: kind
            value: task
        resolver: bundles
  workspaces:
    - name: git-auth
      optional: true

