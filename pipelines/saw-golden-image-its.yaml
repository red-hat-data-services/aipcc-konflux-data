kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: saw-golden-image-its
spec:
  description: |
    Integration Test Suite pipeline for the SAW golden image.

    Provisions an OpenShift Single Node Cluster on IBM Cloud with mapt, with the
    virtualization profile. That profile installs OpenShift Virtualization, so
    the cluster can run virtual machines.

    The pipeline then boots the released disk-image container as a KubeVirt
    guest. It follows the production path of the OpenShell gateway: CDI imports
    the OCI artifact into a DataVolume, and KubeVirt starts the image from that
    DataVolume. Finally, the pipeline checks the image contract inside the guest.

    The disk-image container is a single multi-arch manifest list, so one
    scenario covers every architecture.

    Prerequisites on the IBM Cloud account:
      - a private catalog image built from the OpenShift Local bundle, named
        openshift-local-<version>-x86-64 (cloud-importer openshift-local
        ibmcloud)
      - a secret with the IBM Cloud API key, the region, an availability zone,
        the Object Storage keys and a bucket for the mapt state

    Every run costs an IBM Cloud virtual server instance and takes about one
    hour. Keep the scenario optional.
  # Cluster creation and the profile installation take most of the run. Set the
  # budget here, so the run does not depend on the cluster default timeout.
  timeouts:
    pipeline: 3h0m0s
    tasks: 2h0m0s
  params:
    - name: SNAPSHOT
      description: |
        Snapshot of the application (automatically provided by Konflux ITS).
        Example: {"components":[{"containerImage":"quay.io/red-hat-data-services/saw-disk-image-container@sha256:...","name":"saw-disk-image-container"}]}
    - name: architecture
      default: "x86_64"
      description: |
        Architecture of the guest. The mapt IBM Cloud SNC task runs x86_64 only,
        so this value selects the image variant and not the instance.
    - name: ocp-version
      default: ""
      description: |
        OpenShift version of the SNC catalog image on IBM Cloud, for example
        4.22.14. Empty selects the latest catalog image of the account.
    - name: snc-cpus
      default: "16"
      description: |
        vCPU count for the SNC instance. mapt raises the value when the profile
        asks for more.
    - name: snc-memory
      default: "64"
      description: Memory in GiB for the SNC instance.
    - name: snc-disk-size
      default: "200"
      description: Disk size in GB for the SNC instance.
    - name: ibmcloud-zone
      default: ""
      description: |
        IBM Cloud availability zone, for example us-south-2. The create
        operation needs it, and it must belong to the region of the credentials
        secret.
    - name: ibmcloud-credentials-secret
      default: "ibmcloud-konflux-tests"
      description: |
        Secret with the IBM Cloud credentials, keys api-key, region,
        cos-access-key, cos-secret-key and bucket.
    - name: spot
      default: "true"
      description: Use a spot instance for the SNC cluster.
    - name: ocp-snc-credentials-secret
      default: "ocp-snc-credentials"
      description: |
        Secret with the Red Hat pull secret for the SNC installation, key
        pull-secret. mapt treats the secret as optional.
    - name: enforce
      default: "true"
      description: |
        "true" makes a failed check fail the scenario. "false" reports a warning.
    - name: debug
      default: "false"
      description: Enable verbose logs.
  results:
    - name: container-image
      value: $(tasks.create-configuration.results.container-image)
    - name: TEST_OUTPUT
      value: $(tasks.verify-saw-disk-image.results.TEST_OUTPUT)

  tasks:
    - name: create-configuration
      params:
        - name: architecture
          value: $(params.architecture)
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/red-hat-data-services/aipcc-konflux-data
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/config-from-snapshot.yaml

    - name: create-snc-cluster
      params:
        - name: id
          value: "$(context.pipelineRun.name)"
        - name: operation
          value: "create"
        # virtualization installs OpenShift Virtualization and CNV.
        - name: profile
          value: "$(tasks.create-configuration.results.snc-profile)"
        - name: cpus
          value: "$(params.snc-cpus)"
        - name: memory
          value: "$(params.snc-memory)"
        - name: disk-size
          value: "$(params.snc-disk-size)"
        - name: version
          value: "$(params.ocp-version)"
        - name: compute-sizes
          value: "$(tasks.create-configuration.results.snc-compute-sizes)"
        - name: spot
          value: "$(params.spot)"
        - name: zone
          value: "$(params.ibmcloud-zone)"
        - name: secret-ibmcloud-credentials
          value: "$(params.ibmcloud-credentials-secret)"
        - name: secret-ocp-snc-credentials
          value: "$(params.ocp-snc-credentials-secret)"
        - name: ownerKind
          value: "PipelineRun"
        - name: ownerName
          value: "$(context.pipelineRun.name)"
        - name: ownerUid
          value: "$(context.pipelineRun.uid)"
        - name: debug
          value: "$(params.debug)"
        - name: tags
          value: "$(tasks.create-configuration.results.base-tags),mapt-id=$(context.pipelineRun.name),mapt-type=ocp-snc,purpose=saw-golden-image-its,pipeline-run-url=$(tasks.create-configuration.results.pipeline-run-url-prefix)$(context.pipelineRun.name)"
      runAfter:
        - create-configuration
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/redhat-developer/mapt
          # The IBM Cloud task exists only on main since 2026-11-25. Pin the
          # commit, so a change on main cannot alter the pipeline. Replace the
          # commit with a release tag when mapt publishes one that holds it.
          - name: revision
            value: 60acb4d878c2ec1089c1b22c8743c42672d0011b
          - name: pathInRepo
            value: tkn/infra-ibmcloud-ocp-snc.yaml

    - name: verify-saw-disk-image
      # Longer than the sum of the waits inside the task (3 x 30 min), so a slow
      # import or a slow boot fails with the task message, not a bare timeout.
      timeout: 2h0m0s
      params:
        - name: cluster-access-secret-name
          value: "$(tasks.create-snc-cluster.results.cluster-access-secret)"
        - name: container-image
          value: "$(tasks.create-configuration.results.container-image)"
        - name: enforce
          value: "$(params.enforce)"
        - name: debug
          value: "$(params.debug)"
      runAfter:
        - create-snc-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/red-hat-data-services/aipcc-konflux-data
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/verify-saw-disk-image.yaml

  finally:
    # Cleanup must run on success and on failure alike, else the virtual server
    # instance stays on the account. The destroy operation reads the state from
    # the Object Storage bucket of the credentials secret, so it needs no zone.
    - name: delete-snc-cluster
      params:
        - name: id
          value: "$(context.pipelineRun.name)"
        - name: operation
          value: "destroy"
        - name: force-destroy
          value: "true"
        - name: secret-ibmcloud-credentials
          value: "$(params.ibmcloud-credentials-secret)"
        - name: secret-ocp-snc-credentials
          value: "$(params.ocp-snc-credentials-secret)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/redhat-developer/mapt
          - name: revision
            value: 60acb4d878c2ec1089c1b22c8743c42672d0011b
          - name: pathInRepo
            value: tkn/infra-ibmcloud-ocp-snc.yaml
