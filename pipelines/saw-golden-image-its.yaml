kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: saw-golden-image-its
spec:
  description: |
    Integration Test Suite pipeline for the SAW golden image.

    Provisions an OpenShift Single Node Cluster on AWS with mapt, with the
    virtualization profile. That profile installs OpenShift Virtualization and
    selects a bare metal instance, so the cluster can run virtual machines.

    The pipeline then boots the released disk-image container as a KubeVirt
    guest. It follows the production path of the OpenShell gateway: CDI imports
    the OCI artifact into a DataVolume, and KubeVirt starts the image from that
    DataVolume. Finally, the pipeline checks the image contract inside the guest.

    The disk-image container is a single multi-arch manifest list, so one
    scenario covers every architecture.

    Every run costs a bare metal instance on AWS and takes about one hour. Keep
    the scenario optional.
  params:
    - name: SNAPSHOT
      description: |
        Snapshot of the application (automatically provided by Konflux ITS).
        Example: {"components":[{"containerImage":"quay.io/red-hat-data-services/saw-disk-image-container@sha256:...","name":"saw-disk-image-container"}]}
    - name: architecture
      default: "x86_64"
      description: Architecture of the guest. mapt SNC supports x86_64 only.
    - name: ocp-version
      default: "4.21.0"
      description: OpenShift version for the SNC cluster.
    - name: snc-cpus
      default: "16"
      description: |
        vCPU count for the SNC instance. The virtualization profile needs at
        least 16 vCPUs, and mapt raises the value when the profile asks for more.
    - name: snc-memory
      default: "64"
      description: Memory in GiB for the SNC instance.
    - name: snc-disk-size
      default: "200"
      description: Disk size in GB for the SNC instance.
    - name: spot
      default: "true"
      description: Use a spot instance for the SNC cluster.
    - name: ocp-snc-credentials-secret
      default: "ocp-snc-credentials"
      description: |
        Secret with the Red Hat pull secret for the SNC installation, key
        pull-secret. mapt treats the secret as optional.
    - name: enforce
      default: "true"
      description: |
        "true" makes a failed check fail the scenario. "false" reports a warning.
    - name: debug
      default: "false"
      description: Enable verbose logs.
  results:
    - name: container-image
      value: $(tasks.create-configuration.results.container-image)
    - name: TEST_OUTPUT
      value: $(tasks.verify-saw-disk-image.results.TEST_OUTPUT)

  tasks:
    - name: create-configuration
      params:
        - name: architecture
          value: $(params.architecture)
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/red-hat-data-services/aipcc-konflux-data
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/config-from-snapshot.yaml

    - name: create-snc-cluster
      params:
        - name: id
          value: "$(context.pipelineRun.name)"
        - name: operation
          value: "create"
        # virtualization installs OpenShift Virtualization and CNV, and makes
        # mapt select a bare metal instance with nested virtualization.
        - name: profile
          value: "$(tasks.create-configuration.results.snc-profile)"
        - name: arch
          value: "$(tasks.create-configuration.results.mapt-architecture)"
        - name: cpus
          value: "$(params.snc-cpus)"
        - name: memory
          value: "$(params.snc-memory)"
        - name: disk-size
          value: "$(params.snc-disk-size)"
        - name: version
          value: "$(params.ocp-version)"
        - name: compute-sizes
          value: "$(tasks.create-configuration.results.snc-compute-sizes)"
        - name: spot
          value: "$(params.spot)"
        - name: spot-eviction-tolerance
          value: "high"
        - name: spot-increase-rate
          value: "30"
        - name: secret-aws-credentials
          value: "aws-konflux-tests"
        - name: secret-ocp-snc-credentials
          value: "$(params.ocp-snc-credentials-secret)"
        - name: ownerKind
          value: "PipelineRun"
        - name: ownerName
          value: "$(context.pipelineRun.name)"
        - name: ownerUid
          value: "$(context.pipelineRun.uid)"
        - name: debug
          value: "$(params.debug)"
        - name: tags
          value: "$(tasks.create-configuration.results.base-tags),mapt-id=$(context.pipelineRun.name),mapt-type=ocp-snc,purpose=saw-golden-image-its,pipeline-run-url=$(tasks.create-configuration.results.pipeline-run-url-prefix)$(context.pipelineRun.name)"
      runAfter:
        - create-configuration
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/redhat-developer/mapt
          - name: revision
            value: v0.14.7
          - name: pathInRepo
            value: tkn/infra-aws-ocp-snc.yaml

    - name: verify-saw-disk-image
      timeout: 1h0m0s
      params:
        - name: cluster-access-secret-name
          value: "$(tasks.create-snc-cluster.results.cluster-access-secret)"
        - name: container-image
          value: "$(tasks.create-configuration.results.container-image)"
        - name: enforce
          value: "$(params.enforce)"
        - name: debug
          value: "$(params.debug)"
      runAfter:
        - create-snc-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/red-hat-data-services/aipcc-konflux-data
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/verify-saw-disk-image.yaml

  finally:
    # Cleanup must run on success and on failure alike, else the bare metal
    # instance stays on the account.
    - name: delete-snc-cluster
      params:
        - name: id
          value: "$(context.pipelineRun.name)"
        - name: operation
          value: "destroy"
        - name: force-destroy
          value: "true"
        - name: secret-aws-credentials
          value: "aws-konflux-tests"
        - name: secret-ocp-snc-credentials
          value: "$(params.ocp-snc-credentials-secret)"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/redhat-developer/mapt
          - name: revision
            value: v0.14.7
          - name: pathInRepo
            value: tkn/infra-aws-ocp-snc.yaml
