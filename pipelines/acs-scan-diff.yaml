apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: acs-scan-diff
spec:
  description: |
    Evidence-only ACS CVE comparison, runnable manually or as a stage
    finalPipeline. Never use this as a tenantPipeline or release gate.
    Release mode takes release/releasePlan/snapshot and selects the latest
    Released prod baseline for that component. Snapshot-pair mode takes
    component/baseline-snapshot/snapshot and extracts that component's exact
    image from both snapshots, requiring the same application; the baseline
    snapshot must already have been verified against its archived Release
    (Released=True, matching artifact digests) by the caller: this pipeline
    performs no archive lookup or publication check. For pre-release manual
    use, pass component/baseline-ref/candidate-ref instead; no Release CR is
    needed.
    Both images must be digest-pinned and have identical Linux platforms.
    Snapshot annotation is optional in explicit mode. No native report uploads.
    Central's database is live, not frozen: deltas are observed additions/
    removals, not verified remediation. The producing run must succeed.
    task-revision MUST equal the commit SHA used to resolve this pipeline,
    so nested tasks also work before merge and evidence identifies the code.
    Use the release account by default and override only the scan TaskRun
    with an existing ACS-authorized build account. The resolver needs
    components-namespace-pull; release mode also needs get/list releases and
    get snapshots. The annotation task needs get/patch snapshots, not ACS.
    The comparison file is passed via Trusted Artifacts, not a large Tekton
    result or shared workspace. Only the digest-bound locator and counts are
    Task results. Uses the existing trusted-artifacts registry credential;
    publishes temporary comparison data, not native reports/image referrers.
    No ReleasePlans are wired here.
  params:
    - name: task-revision
      description: Same immutable Git commit SHA used to resolve this pipeline.
    - name: release
      default: ""
    - name: releasePlan
      default: ""
    - name: snapshot
      default: ""
    - name: baseline-snapshot
      default: ""
    - name: prod-release-plan
      default: ""
    - name: component
      default: ""
    - name: baseline-ref
      default: ""
    - name: candidate-ref
      default: ""
    - name: ociStorage
      description: Existing OCI repository for temporary comparison artifacts, without tag/digest.
      default: quay.io/aipcc-cicd/aipcc-konflux-trusted-artifacts
    - name: ociArtifactExpiresAfter
      default: "1d"
  results:
    - name: baseline-release
      value: $(tasks.resolve.results.baseline-release)
    - name: baseline-image
      value: $(tasks.resolve.results.baseline-image)
    - name: candidate-image
      value: $(tasks.resolve.results.candidate-image)
    - name: baseline-cve-count
      value: $(tasks.scan.results.baseline-cve-count)
    - name: candidate-cve-count
      value: $(tasks.scan.results.candidate-cve-count)
    - name: fixed-cve-count
      description: Observed baseline-only CVEs, not verified remediation.
      value: $(tasks.scan.results.fixed-cve-count)
    - name: new-cve-count
      value: $(tasks.scan.results.new-cve-count)
  tasks:
    - name: resolve
      timeout: 15m
      params:
        - name: task-revision
          value: $(params.task-revision)
        - name: release
          value: $(params.release)
        - name: releasePlan
          value: $(params.releasePlan)
        - name: snapshot
          value: $(params.snapshot)
        - name: baseline-snapshot
          value: $(params.baseline-snapshot)
        - name: prod-release-plan
          value: $(params.prod-release-plan)
        - name: component
          value: $(params.component)
        - name: baseline-ref
          value: $(params.baseline-ref)
        - name: candidate-ref
          value: $(params.candidate-ref)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/red-hat-data-services/aipcc-konflux-data
          - name: revision
            value: $(params.task-revision)
          - name: pathInRepo
            value: tasks/acs-scan-diff-resolve.yaml
    - name: scan
      timeout: 1h
      params:
        - name: task-revision
          value: $(params.task-revision)
        - name: pipeline-run
          value: $(context.pipelineRun.name)
        - name: component
          value: $(tasks.resolve.results.component)
        - name: prev-release
          value: $(tasks.resolve.results.baseline-release)
        - name: prev-snapshot
          value: $(tasks.resolve.results.prev-snapshot)
        - name: baseline-ref
          value: $(tasks.resolve.results.baseline-image)
        - name: candidate-ref
          value: $(tasks.resolve.results.candidate-image)
        - name: scan-baseline-refs
          value: $(tasks.resolve.results.scan-baseline-refs)
        - name: scan-candidate-refs
          value: $(tasks.resolve.results.scan-candidate-refs)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/red-hat-data-services/aipcc-konflux-data
          - name: revision
            value: $(params.task-revision)
          - name: pathInRepo
            value: tasks/acs-scan-diff.yaml
    - name: annotate
      timeout: 5m
      when:
        - input: $(params.snapshot)
          operator: notin
          values: [""]
      params:
        - name: sourceDataArtifact
          value: $(tasks.scan.results.sourceDataArtifact)
        - name: snapshot
          value: $(params.snapshot)
        - name: task-revision
          value: $(params.task-revision)
        - name: pipeline-run
          value: $(context.pipelineRun.name)
        - name: component
          value: $(tasks.resolve.results.component)
        - name: baseline-ref
          value: $(tasks.resolve.results.baseline-image)
        - name: candidate-ref
          value: $(tasks.resolve.results.candidate-image)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/red-hat-data-services/aipcc-konflux-data
          - name: revision
            value: $(params.task-revision)
          - name: pathInRepo
            value: tasks/acs-scan-diff-annotate.yaml
