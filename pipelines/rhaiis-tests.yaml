kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: rhaiis-tests
spec:
  params:
    - name: architecture
      default: "x86_64"
      description: One of x86_64, aarch64
    - name: component
      description: Konflux component to test, e.g. rhaiis-cuda-ubi9
    - name: debug
      default: "false"
    - name: model-names
      type: array
      default:
        - "ibm-granite/granite-3.3-8b-instruct"
      description: List of models to test
    - name: SNAPSHOT
      description: |
        Snapshot of the application
        Example:
        {"components": [{"containerImage":"quay.io/redhat-user-workloads/ai-tenant/rhaiis/rhaiis-spyre-ubi9@sha256:f36864ec0d7a18a3143296ba2e624eca1fa6ba0af87a7196b325384785bbcf4b","name":"rhaiis-spyre-ubi9","source":{"git":{"context":".","dockerfileUrl":"Containerfile.spyre-ubi9","revision":"488e59cf0fdce2ab17f0358fd71cc8136d14aa94","url":"https://gitlab.com/redhat/rhel-ai/rhaiis/containers"}}},{"containerImage":"quay.io/redhat-user-workloads/ai-tenant/rhaiis/rhaiis-tpu-ubi9@sha256:779f10fcd1b24702c5b621ff46b0c34e7f9dda0523619d9b30d9fdecde3b6bd3","name":"rhaiis-tpu-ubi9","source":{"git":{"context":".","dockerfileUrl":"Containerfile.tpu-ubi9","revision":"488e59cf0fdce2ab17f0358fd71cc8136d14aa94","url":"https://gitlab.com/redhat/rhel-ai/rhaiis/containers"}}},{"containerImage":"quay.io/redhat-user-workloads/ai-tenant/rhaiis/rhaiis-cuda-ubi9@sha256:df300e32078427d779738bd919cc53aee772118246388f3ea8d529af0e8a85e9","name":"rhaiis-cuda-ubi9","source":{"git":{"context":".","dockerfileUrl":"Containerfile.cuda-ubi9","revision":"488e59cf0fdce2ab17f0358fd71cc8136d14aa94","url":"https://gitlab.com/redhat/rhel-ai/rhaiis/containers"}}},{"containerImage":"quay.io/redhat-user-workloads/ai-tenant/rhaiis/rhaiis-model-opt-cuda-ubi9@sha256:14296dd0d10e172a50e1d4c91951a3c0548e4036ad90e444da48976615130973","name":"rhaiis-model-opt-cuda-ubi9","source":{"git":{"context":".","dockerfileUrl":"Containerfile.model-opt.cuda-ubi9","revision":"488e59cf0fdce2ab17f0358fd71cc8136d14aa94","url":"https://gitlab.com/redhat/rhel-ai/rhaiis/containers"}}},{"containerImage":"quay.io/redhat-user-workloads/ai-tenant/rhaiis/rhaiis-rocm-ubi9@sha256:75d66ba07466ec7a38a6de03108de6d4cf08c5c73eafcd97a7cae28d772fd23d","name":"rhaiis-rocm-ubi9","source":{"git":{"revision":"488e59cf0fdce2ab17f0358fd71cc8136d14aa94","url":"https://gitlab.com/redhat/rhel-ai/rhaiis/containers"}}}]}
  results:
    - name: container-image
      value: $(tasks.create-configuration.results.container-image)
  tasks:
    - name: create-configuration
      description: Placeholder task that prints the Snapshot and outputs standard TEST_OUTPUT
      params:
        - name: component
          value: $(params.component)
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskRef:
        resolver: git
        params:
          - name: org
            value: redhat
          - name: repo
            value: rhel-ai/konflux-data
          - name: scmType
            value: gitlab
          - name: serverURL
            value: https://gitlab.com
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/config-from-snapshot.yaml
          - name: token
            value: pipelines-as-code-secret
          - name: tokenKey
            value: password
    - name: create-vm-aws
      params:
        - name: arch
          value: "$(params.architecture)"
        - name: compute-sizes
          value: "$(tasks.create-configuration.results.vm-types)"
        - name: debug
          value: "$(params.debug)"
        - name: id
          value: "$(context.pipelineRun.name)"
        - name: host-access-secret-name
          value: "mapt-$(context.pipelineRun.name)"
        - name: operation
          value: "create"
        - name: ownerKind
          value: "PipelineRun"
        - name: ownerName
          value: "$(context.pipelineRun.name)"
        - name: ownerUid
          value: "$(context.pipelineRun.uid)"
        - name: secret-aws-credentials
          value: "aws-konflux-tests"
        - name: spot
          value: "true"
        - name: spot-increase-rate
          value: "100"
        - name: spot-eviction-tolerance
          value: "medium"
        - name: tags
          value: "konflux=true,ci=true,component=$(params.component),product=rhaiis,app-code=GITL-005,service-phase=dev,cost-center=687"
        - name: version
          value: "9.6" # RHEL version
      runAfter:
        - create-configuration
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/redhat-developer/mapt"
          # todo configure renovate to update this
          - name: revision
            value: "v0.9.9"
          - name: pathInRepo
            value: "tkn/infra-aws-rhel.yaml"
      when:
        - input: $(tasks.create-configuration.results.cloud-provider)
          operator: in
          values: ["aws"]
    - name: configure-vm-cuda
      params:
        - name: host-access-secret-name
          value: "$(tasks.create-vm-aws.results.host-access-secret)"
      runAfter:
        - create-vm-aws
      taskRef:
        resolver: git
        params:
          - name: org
            value: redhat
          - name: repo
            value: rhel-ai/konflux-data
          - name: scmType
            value: gitlab
          - name: serverURL
            value: https://gitlab.com
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/configure-vm-cuda.yaml
          - name: token
            value: pipelines-as-code-secret
          - name: tokenKey
            value: password
      when:
        - input: $(tasks.create-configuration.results.variant)
          operator: in
          values: ["cuda-ubi9"]
    - name: pull-images
      params:
        - name: container-images
          value: ["$(tasks.create-configuration.results.container-image)"]
        - name: host-access-secret-name
          value: "$(tasks.create-vm-aws.results.host-access-secret)"
        - name: pull-secret-name
          value: "rhaiis-pull"
      runAfter:
        - configure-vm-cuda
      taskRef:
        resolver: git
        params:
          - name: org
            value: redhat
          - name: repo
            value: rhel-ai/konflux-data
          - name: scmType
            value: gitlab
          - name: serverURL
            value: https://gitlab.com
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/pull-image.yaml
          - name: token
            value: pipelines-as-code-secret
          - name: tokenKey
            value: password
    - name: download-models
      params:
        - name: model-names
          value: ["$(params.model-names[*])"]
        - name: host-access-secret-name
          value: "$(tasks.create-vm-aws.results.host-access-secret)"
      runAfter:
        - configure-vm-cuda
      taskRef:
        resolver: git
        params:
          - name: org
            value: redhat
          - name: repo
            value: rhel-ai/konflux-data
          - name: scmType
            value: gitlab
          - name: serverURL
            value: https://gitlab.com
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/download-model.yaml
          - name: token
            value: pipelines-as-code-secret
          - name: tokenKey
            value: password
    - name: test-models
      params:
        - name: container-image
          value: "$(tasks.create-configuration.results.container-image)"
        - name: debug
          value: "$(params.debug)"
        - name: host-access-secret-name
          value: "$(tasks.create-vm-aws.results.host-access-secret)"
        - name: model-names
          value: ["$(params.model-names[*])"]
      runAfter:
        - pull-images
        - download-models
      taskRef:
        resolver: git
        params:
          - name: org
            value: redhat
          - name: repo
            value: rhel-ai/konflux-data
          - name: scmType
            value: gitlab
          - name: serverURL
            value: https://gitlab.com
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/rhaiis-container-test.yaml
          - name: token
            value: pipelines-as-code-secret
          - name: tokenKey
            value: password
  finally:
    - name: delete-vm
      params:
        - name: id
          value: "$(context.pipelineRun.name)"
        - name: operation
          value: "destroy"
        - name: secret-aws-credentials
          value: "aws-konflux-tests"
      taskRef:
        resolver: git
        params:
          - name: url
            value: "https://github.com/redhat-developer/mapt"
          # TODO configure renovate to update this
          - name: revision
            value: "v0.9.8"
          - name: pathInRepo
            value: "tkn/infra-aws-rhel.yaml"
