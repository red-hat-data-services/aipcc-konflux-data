apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: container-build
spec:
  finally:
  - name: slack-webhook-notification
    params:
    - name: secret-name
      value: slack-webhook
    - name: key-name
      value: rhel-ai-notification
    - name: message
      value: $(params.slack-message)
    - name: files
      value:
      - $(params.slack-files[*])
    - name: submodules
      value:
      - $(params.slack-submodules[*])
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/konflux-ci/tekton-integration-catalog.git
      - name: revision
        value: 5d9486140df10bc8a0b8e78b6ee6a6138de5bf53
      - name: pathInRepo
        value: tasks/slack-webhook-notification/0.1/slack-webhook-notification.yaml
    when:
    - input: $(tasks.status)
      operator: in
      values: ["Completed", "Succeeded"]
    - input: $(params.send-slack-notification)
      operator: in
      values: ["true"]
  params:
  - description: Source Repository URL
    name: git-url
    type: string
  - default: ""
    description: Revision of the Source Repository
    name: revision
    type: string
  - description: Fully Qualified Output Image
    name: output-image
    type: string
  - default: .
    description: Path to the source code of an application's component from where to build image.
    name: path-context
    type: string
  - default: Dockerfile
    description: Path to the Dockerfile inside the context specified by parameter path-context
    name: dockerfile
    type: string
  - default: "false"
    description: Skip checks against built image
    name: skip-checks
    type: string
  - default: "false"
    description: Execute the build with network isolation
    name: hermetic
    type: string
  - default: ""
    description: Build dependencies to be prefetched by Cachi2
    name: prefetch-input
    type: string
  - default: ""
    description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
    name: image-expires-after
  - default: "true"
    description: Build a source image.
    name: build-source-image
    type: string
  - default: []
    description: Array of --build-arg values ("arg=value" strings) for buildah
    name: build-args
    type: array
  - default: ""
    description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
    name: build-args-file
    type: string
  - default: ""
    description: >-
      Build args file containing the OCI disk image reference to prefetch before
      a hermetic build.
    name: disk-image-build-args-file
    type: string
  - default: OCI_ARTIFACT
    description: >-
      Build arg in disk-image-build-args-file containing the disk image artifact
      reference.
    name: disk-image-artifact-arg
    type: string
  - default: does-not-exist
    description: >-
      Kubernetes secret containing credentials for the disk image artifact
      registry.
    name: disk-image-pull-secret
    type: string
  - name: additional-build-secret
    description: Additional secret to use while building
    type: string
    default: ""
  - name: squash-build
    description: Squash all new and previous layers added as a part of this build, as per --squash
    default: "false"
    type: string
  - name: send-slack-notification
    default: "false"
    description: Send slack notification on completed build
  - name: slack-message
    description: Message to be sent
    type: string
    default: ""
  - name: slack-submodules
    type: array
    description: List of submodules name to dump in the slack notif. Git log since previous submodule commit will be added to the message. The previous submodule commit is found by looking at the previous commit in the repository that declares the submodules.
    default: []
  - name: slack-files
    type: array
    description: List of file to dump. The content will be added to the slack message.
    default: []
  - name: additional-tags
    description: Additional tags to apply to the built image
    type: array
    default: []
  - name: build-platforms
    description: List of platforms to build the container images on. The available set of values is determined by the configuration of the multi-platform-controller.
    type: array
    default:
    - linux-d160-m4xlarge/amd64
  - name: build-image-index
    description: Add built image into an OCI image index
    type: string
    default: "true"
  - name: snyk-project-name
    description: Snyk project name
    type: string
    default: ""
  - name: snyk-org
    description: Snyk Org
    type: string
    default: ""
  - name: activation-key
    description: name of the secret of the activation-key for entitlement builds
    type: string
    default: activation-key
  - name: labels
    description: Additional key=value labels to apply to the built image
    type: array
    default: []
  - name: contextualize-sbom
    description: Determines if SBOM will be contextualized on the build-container task.
    type: string
    default: "false"
  - default: "false"
    description: Enable cache proxy configuration
    name: enable-cache-proxy
  - default: "true"
    description: Enable package registry proxy for prefetch dependencies
    name: enable-package-registry-proxy
    type: string
  - name: source-date-epoch
    type: string
    default: ''
    description: Sets the image created time and the SOURCE_DATE_EPOCH build argument. On its own, it does not change file timestamps inside the layers (set rewrite-timestamp to "true" for that). Leave empty to keep the actual build time.
  - name: rewrite-timestamp
    type: string
    default: 'false'
    description: When "true", clamp file modification times in the image layers to at most source-date-epoch. Does nothing unless source-date-epoch is set.
  - name: omit-history
    type: string
    default: 'false'
    description: When "true", omit the build history (history timestamps, layer metadata, etc.) from the resulting image.
  results:
  - description: ""
    name: IMAGE_URL
    value: $(tasks.build-image-index.results.IMAGE_URL)
  - description: ""
    name: IMAGE_DIGEST
    value: $(tasks.build-image-index.results.IMAGE_DIGEST)
  - description: ""
    name: CHAINS-GIT_URL
    value: $(tasks.clone-repository.results.url)
  - description: ""
    name: CHAINS-GIT_COMMIT
    value: $(tasks.clone-repository.results.commit)
  tasks:
  - name: init
    params:
    - name: enable-cache-proxy
      value: $(params.enable-cache-proxy)
    taskRef:
      params:
      - name: name
        value: init
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:67bea82c44ab9824b81e60b9626bef36545e5cd5206b1edb8435f9f93526f57a
      - name: kind
        value: task
      resolver: bundles
  - name: clone-repository
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.revision)
    - name: depth
      value: 10
    - name: enableSymlinkCheck
      value: false
    - name: ociStorage
      value: $(params.output-image).git
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    runAfter:
    - init
    taskRef:
      params:
      - name: name
        value: git-clone-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:c3c1071a99310be07d5706ea3ef7b4311ebccb17b17b839e606180ee396497dc
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: basic-auth
      workspace: git-auth
  - name: prefetch-dependencies
    params:
    - name: input
      value: $(params.prefetch-input)
    - name: SOURCE_ARTIFACT
      value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
    - name: ociStorage
      value: $(params.output-image).prefetch
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    - name: enable-package-registry-proxy
      value: $(params.enable-package-registry-proxy)
    runAfter:
    - clone-repository
    taskRef:
      params:
      - name: name
        value: prefetch-dependencies-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.11.0@sha256:3839c8468b08b3aab55f4cc92e645ad275012f8ef8235a504aca397121a9e7da
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: git-basic-auth
      workspace: git-auth
    - name: netrc
      workspace: netrc
  - name: prefetch-disk-image
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: PREFETCH_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.PREFETCH_ARTIFACT)
    - name: ociStorage
      value: $(params.output-image).disk-image
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    - name: ADDITIONAL_SECRET
      value: $(params.disk-image-pull-secret)
    - name: SCRIPT_RUNNER_IMAGE
      value: registry.access.redhat.com/ubi9/ubi:9.8-1793580630@sha256:8f989cc9270da6abec0144c22846ed1e6e92e462dc7768ce0981c4ac1d574733
    - name: SCRIPT
      value: |
        #!/usr/bin/env bash
        set -euo pipefail
        cd /var/workdir/source

        BUILD_ARGS_FILE="$(params.disk-image-build-args-file)"
        ARTIFACT_ARG="$(params.disk-image-artifact-arg)"
        if [[ -z "${BUILD_ARGS_FILE}" ]]; then
          echo "No disk image configured for prefetch; passing source artifact through"
          exit 0
        fi
        if [[ ! -f "${BUILD_ARGS_FILE}" ]]; then
          echo "ERROR: build args file ${BUILD_ARGS_FILE} does not exist" >&2
          exit 1
        fi

        artifact_ref=$(awk -F= -v key="${ARTIFACT_ARG}" '
          /^[[:space:]]*#/ { next }
          $1 == key {
            value = substr($0, index($0, "=") + 1)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
            gsub(/^"|"$/, "", value)
            print value
            count++
          }
          END { if (count != 1) exit 1 }
        ' "${BUILD_ARGS_FILE}") || {
          echo "ERROR: expected exactly one ${ARTIFACT_ARG} in ${BUILD_ARGS_FILE}" >&2
          exit 1
        }
        if [[ ! "${artifact_ref}" =~ @sha256:[a-f0-9]{64}$ ]]; then
          echo "ERROR: disk image reference must be pinned by sha256 digest: ${artifact_ref}" >&2
          exit 1
        fi

        case "$(uname -m)" in
          x86_64) oras_arch=amd64; oras_sha256=bff970346470e5ef888e9f2c0bf7f8ee47283f5a45207d6e7a037da1fb0eae0d ;;
          aarch64|arm64) oras_arch=arm64; oras_sha256=edd7195cbb8ba56c29ede413eefa10c8026201d63326017cd315841b4063aa56 ;;
          *) echo "ERROR: unsupported runner architecture $(uname -m)" >&2; exit 1 ;;
        esac
        oras_version=1.2.2
        tmpdir=$(mktemp -d)
        trap 'rm -rf "${tmpdir}"' EXIT
        archive="oras_${oras_version}_linux_${oras_arch}.tar.gz"
        curl -fsSL -o "${tmpdir}/${archive}" \
          "https://github.com/oras-project/oras/releases/download/v${oras_version}/${archive}"
        echo "${oras_sha256}  ${tmpdir}/${archive}" | sha256sum -c -
        tar -xzf "${tmpdir}/${archive}" -C "${tmpdir}" oras

        auth_file=/var/run/secrets/additional-secret/.dockerconfigjson
        if [[ ! -s "${auth_file}" ]]; then
          echo "ERROR: registry credentials not found at ${auth_file}" >&2
          exit 1
        fi
        mkdir -p disk-image
        "${tmpdir}/oras" pull "${artifact_ref}" \
          --registry-config "${auth_file}" \
          --output disk-image
        if [[ ! -s disk-image/disk.qcow2 ]]; then
          echo "ERROR: pull did not produce disk-image/disk.qcow2" >&2
          ls -la disk-image >&2
          exit 1
        fi
        chmod 0440 disk-image/disk.qcow2
        echo "Prefetched ${artifact_ref} into disk-image/disk.qcow2"
    runAfter:
    - prefetch-dependencies
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/konflux-ci/container-build-catalog
      - name: revision
        value: 9f8e323179efbdc862977fcde8cbdc0ef3d7ea05
      - name: pathInRepo
        value: task/run-script-oci-ta/run-script-oci-ta.yaml
  - name: build-container
    timeout: 6h
    matrix:
      params:
      - name: PLATFORM
        value:
        - $(params.build-platforms)
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: HERMETIC
      value: $(params.hermetic)
    - name: PREFETCH_INPUT
      value: $(params.prefetch-input)
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.image-expires-after)
    - name: COMMIT_SHA
      value: $(tasks.clone-repository.results.commit)
    - name: BUILD_ARGS
      value:
      - $(params.build-args[*])
    - name: ADDITIONAL_SECRET
      value: $(params.additional-build-secret)
    - name: ADDITIONAL_BASE_IMAGES
      value:
      - $(tasks.prefetch-disk-image.results.SCRIPT_RUNNER_IMAGE_REFERENCE)
    - name: SQUASH
      value: $(params.squash-build)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-disk-image.results.SCRIPT_ARTIFACT)
    - name: IMAGE_APPEND_PLATFORM
      value: "true"
    - name: LABELS
      value:
      - url=$(params.git-url)
      - release=$(tasks.clone-repository.results.commit-timestamp)
      - git.url=$(params.git-url)
      - git.commit=$(params.revision)
      - $(params.labels[*])
    - name: ACTIVATION_KEY
      value: $(params.activation-key)
    - name: CONTEXTUALIZE_SBOM
      value: $(params.contextualize-sbom)
    - name: SOURCE_DATE_EPOCH
      value: $(params.source-date-epoch)
    - name: REWRITE_TIMESTAMP
      value: $(params.rewrite-timestamp)
    - name: OMIT_HISTORY
      value: $(params.omit-history)
    - name: BUILD_ARGS_FILES
      value:
      - $(params.build-args-file)
    - name: PREFETCH_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.PREFETCH_ARTIFACT)
    runAfter:
    - prefetch-disk-image
    taskRef:
      params:
      - name: name
        value: buildah-remote-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-buildah-remote-oci-ta:0.14.1@sha256:6b4aef24a3c59a206d2d43c99b6b85e715c9b9c7fc905cb25aa6655fa315c332
      - name: kind
        value: task
      resolver: bundles
  - name: build-image-index
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: ALWAYS_BUILD_INDEX
      value: $(params.build-image-index)
    - name: IMAGES
      value:
      - $(tasks.build-container.results.IMAGE_REF[*])
    runAfter:
    - build-container
    taskRef:
      params:
      - name: name
        value: build-image-index
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.4@sha256:6c8091183f05f93c022f07eef03f44a411f1e4d43c39057051306ad1e78d5fc2
      - name: kind
        value: task
      resolver: bundles
  - name: build-source-image
    params:
    - name: BINARY_IMAGE
      value: "$(tasks.build-image-index.results.IMAGE_URL)"
    - name: BINARY_IMAGE_DIGEST
      value: "$(tasks.build-image-index.results.IMAGE_DIGEST)"
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: PREFETCH_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.PREFETCH_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: source-build-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-source-build-oci-ta:0.4.0@sha256:4bf27ae2f9de1da9f63258f8a6c2f31e34e7270d8ab1004e61f1abe0756f6948
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.build-source-image)
      operator: in
      values:
      - "true"
  - name: deprecated-base-image-check
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: deprecated-image-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.5@sha256:81b7cad8d5fd0148b157d622f4064f57d38aa33c142275050c8a4727d1e2144c
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-snyk-check
    timeout: 2h
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: ARGS
      value: "--report --org=$(params.snyk-org) --project-name=$(params.snyk-project-name)"
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-snyk-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check-oci-ta:0.5.1@sha256:53443febc3a87ea6d4baacffc70d6f7dbdd1b4e69e0852337661097c73433519
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - matrix:
      params:
      - name: image-arch
        value:
        - $(params.build-platforms)
    name: clamav-scan
    timeout: 6h
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: clamav-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3.4@sha256:79d5b56151a4bab17ed6f49fad19e62306ec74533120c8739318657406b958de
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: apply-tags
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: ADDITIONAL_TAGS
      value:
      - $(params.additional-tags[*])
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: apply-tags
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.3.2@sha256:610662163505af1af243bd7bea57443e1351c68b05405f7cd343dbc4262dec06
      - name: kind
        value: task
      resolver: bundles
  - name: rpms-signature-scan
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: rpms-signature-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-rpms-signature-scan:0.2.2@sha256:9ef4dabd53e823e3139b99c8de708be4ee759d63b32982847929df19ab75b2f8
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-shell-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-shell-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-shell-check-oci-ta:0.1.1@sha256:83722286ec3297e3f66b0c220cec8895e0f745337e464c1d1c038ed737cf69fd
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-unicode-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-unicode-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-unicode-check-oci-ta:0.4.1@sha256:2ee89730856f542d851d99b5d945963583a840c295354dc4257a0052841e35ab
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  workspaces:
  - name: git-auth
    optional: true
  - name: netrc
    optional: true
