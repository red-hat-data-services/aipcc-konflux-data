# Fast multi-architecture container build pipeline with an image index.
#
# Companion to fast-container.yaml for pull request feedback: the same
# stripped-down build (non-hermetic, no source image, no checks, layer
# cache in the component's own repository), but it matrixes the buildah
# task over several platforms and composes the per-arch outputs into an
# image index at the base output-image tag, the way full-container.yaml
# does. This exists to measure what the index (and the extra platform
# legs) cost on top of the single-arch fast pipeline. See RHAI-19674.
#
# Everything else matches fast-container.yaml: the buildah-remote-oci-ta
# 0.15.0-cache3 fork (registry-distributed layer cache, 30d cache tag TTL),
# skip-sbom-generation / skip-injections /
# stable-labels knobs, and no init/prefetch/build-source-image/apply-tags
# or check tasks. The build-image-index task is the same bundle
# full-container.yaml resolves (0.4).
#
# Per-leg images are pushed to <output-image>-<platform> (the build task
# appends the platform, munged to [a-zA-Z0-9-]); the index lands on the
# base output-image tag. Matrix legs with non-x86 platforms (for example
# linux-d160-m2xlarge/arm64) are dispatched to remote build hosts by the
# multi-platform-controller, exactly like full-container.yaml.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: fast-container-multi-build
spec:
  description: >-
    Fast multi-architecture container build for pull requests. Builds the
    requested platforms with buildah (reusing the registry-distributed
    layer cache in the component's own repository), then composes them
    into an image index. No source image and no image checks.
  params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: .
      description: Path to the source code of an application's component from where to build image.
      name: path-context
      type: string
    - default: Dockerfile
      description: Path to the Dockerfile inside the context specified by parameter path-context
      name: dockerfile
      type: string
    - default:
        - linux/x86_64
      description: List of platforms to build the container images on. The available set of values is determined by the configuration of the multi-platform-controller.
      name: build-platforms
      type: array
    - default: ""
      description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
    - default: []
      description: Array of --build-arg values ("arg=value" strings) for buildah
      name: build-args
      type: array
    - default: ""
      description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
      name: build-args-file
      type: string
    - name: additional-build-secret
      description: Additional secret to use while building
      type: string
      default: ""
    - name: squash-build
      description: Squash all new and previous layers added as a part of this build, as per --squash
      default: "false"
      type: string
    - name: add-capabilities
      description: Parameter for ADD_CAPABILITIES for the container build
      default: ""
      type: string
    - default: "false"
      description: Allow nested privileged container build. This is mostly useful for bootc images that embed container images.
      name: privileged-nested
      type: string
    - name: buildah-format
      description: The manifest format to use for built images
      type: string
      default: docker
    - name: labels
      description: Additional key=value labels to apply to the built image
      type: array
      default: []
    - name: skip-sbom-generation
      description: Skip SBOM generation and attach. Default "true" — the syft scans run inside the build VM and measured 6m51s-11m43s on the rhaiis CUDA image (a third of a warm build), and throwaway on-pr-fast-* images never pass Enterprise Contract. Set "false" to produce MR SBOMs anyway.
      type: string
      default: "true"
    - name: skip-injections
      description: >-
        Skip konflux-build-cli buildinfo injection (the appended
        COPY --from=.konflux-buildinfo steps writing labels.json and
        content-sets.json to /usr/share/buildinfo/). Default "true" — the
        injected labels.json contains the commit SHA and a build timestamp,
        so those layers bust the layer cache on every commit, and a miss
        costs a full rootfs diff walk (~5m on the 12 GB rhaiis CUDA image).
        The files only feed Clair scanning, which this pipeline does not
        run. Set "false" to produce them anyway.
      type: string
      default: "true"
    - name: stable-labels
      description: >-
        Make the final image labels cache-stable so the synthetic LABEL step
        hits the layer cache. buildah's cache key includes the rendered LABEL
        instruction text, so per-build label values (created timestamp,
        revision) bust the step and force a cold rootfs diff walk (~5m on
        the 12 GB rhaiis CUDA image). When true, the image omits revision/
        vcs-ref/build-date labels and pins created to epoch 0. Throwaway
        on-pr-fast-* images do not need them; PaC records the commit SHA to
        digest mapping.
      type: string
      default: "false"
    - name: enable-layer-cache
      description: Enable buildah's registry-distributed layer cache. The cache entries live in the component's own output repository (IMAGE minus tag). Set "false" to build fully cold.
      type: string
      default: "true"
    - name: cache-expires-after
      description: Quay TTL applied to cache tags via the quay.expires-after layer label (e.g. 1h, 2d, 3w). Required when the layer cache is enabled; the build fails rather than accumulating cache entries forever.
      type: string
      default: "30d"
  results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
  tasks:
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: depth
          value: 10
        - name: enableSymlinkCheck
          value: false
        - name: ociStorage
          value: $(params.output-image).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      taskRef:
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:a3678910c2bf9187a66a96066193cb41046fbb7097160bf2be6a374ed5e49d30
          - name: kind
            value: task
        resolver: bundles
      workspaces:
        - name: basic-auth
          workspace: git-auth
    - name: build-container
      # Generous: the first cold aarch64 cache populate on the m2xlarge
      # remote host measured ~2h for the wheel install alone (aarch64 wheel
      # downloads are much slower than x86_64); the commit + cache push of
      # the ~10 GB CUDA layer needs another stretch on top. Warm legs
      # finish in well under 30m.
      timeout: 4h
      matrix:
        params:
          - name: PLATFORM
            value:
              - $(params.build-platforms)
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: BUILDAH_FORMAT
          value: $(params.buildah-format)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
        - name: BUILD_ARGS_FILES
          value:
            - $(params.build-args-file)
        - name: ADD_CAPABILITIES
          value: $(params.add-capabilities)
        - name: ADDITIONAL_SECRET
          value: $(params.additional-build-secret)
        - name: PRIVILEGED_NESTED
          value: $(params.privileged-nested)
        - name: SQUASH
          value: $(params.squash-build)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: PREFETCH_ARTIFACT
          value: ""
        - name: HERMETIC
          value: "false"
        - name: IMAGE_APPEND_PLATFORM
          value: "true"
        - name: SKIP_SBOM_GENERATION
          value: $(params.skip-sbom-generation)
        - name: SKIP_INJECTIONS
          value: $(params.skip-injections)
        - name: STABLE_LABELS
          value: $(params.stable-labels)
        - name: ENABLE_LAYER_CACHE
          value: $(params.enable-layer-cache)
        - name: LAYER_CACHE_EXPIRES_AFTER
          value: $(params.cache-expires-after)
        - name: LABELS
          value:
          - url=$(params.git-url)
          - git.url=$(params.git-url)
          - $(params.labels[*])
      runAfter:
        - clone-repository
      taskRef:
        params:
          - name: name
            value: buildah-remote-oci-ta
          - name: bundle
            value: quay.io/ktdreyer/tekton-catalog/task-buildah-remote-oci-ta:0.15.0-cache3@sha256:6dc470dcc8b7555e630d33a9d51538d67a1267ed9c5a5025f910385cf6c95fc1
          - name: kind
            value: task
        resolver: bundles
    - name: build-image-index
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: ALWAYS_BUILD_INDEX
          value: "true"
        - name: BUILDAH_FORMAT
          value: $(params.buildah-format)
        - name: IMAGES
          value:
          - $(tasks.build-container.results.IMAGE_REF[*])
      runAfter:
        - build-container
      taskRef:
        params:
          - name: name
            value: build-image-index
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.4@sha256:654446d8ec028b20ed6ada8a96486ff16692a25192755aa04a99cea8e0afb7e2
          - name: kind
            value: task
        resolver: bundles
  workspaces:
    - name: git-auth
      optional: true
