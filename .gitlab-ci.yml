include:
  # AI Code Review
  - project: 'redhat/rhel-ai/core/tools/ai-review'
    file: 'ai-review.gitlab-ci.yml'
    inputs:
      INSTRUCTIONS: "Use the repo-reviewer skill for specialized Konflux data review. Focus on Tekton pipeline/task correctness, release definition accuracy, and pipelinerun parameter consistency."
    rules:
      - if: '$CI_MERGE_REQUEST_LABELS =~ /ai-review/'

default:
  tags:
    - aipcc-k8s-cicd

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - lint

check-trusted-tasks:
  stage: lint
  image: registry.access.redhat.com/ubi9/python-312
  script:
    - pip install pyyaml
    - python3 scripts/check-trusted-tasks.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
