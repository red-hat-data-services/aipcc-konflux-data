include:
  # AI Code Review
  - project: 'redhat/rhel-ai/agentic-ci/code-review'
    file: 'ci/code-review.gitlab-ci.yml'
    inputs:
      INSTRUCTIONS: "Use the repo-reviewer skill for specialized Konflux data review. Focus on Tekton pipeline/task correctness, release definition accuracy, and pipelinerun parameter consistency."
    rules:
      - if: '$CI_MERGE_REQUEST_LABELS =~ /ai-review/'

default:
  tags:
    - aipcc-k8s-cicd

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
