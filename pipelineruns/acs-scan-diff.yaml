# Manual pre-release scan: replace ALL <PLACEHOLDERS> before creating this run.
# Publish the feature branch first; use the SAME full commit SHA in both places.
# No Release CR or ReleasePlan wiring. Publishes a temporary Trusted Artifact,
# not native reports or image referrers; uses the existing check-labels repository.
# See acs-scan-diff.md beside this file for release mode and evidence extraction.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: acs-scan-diff-
  namespace: ai-tenant
  labels:
    appstudio.openshift.io/component: "<COMPONENT>"
spec:
  taskRunTemplate:
    # Resolve and annotate with the existing release account; no ACS grant needed.
    serviceAccountName: aipcc-releaser-bot-sa
  taskRunSpecs:
    - pipelineTaskName: scan
      serviceAccountName: "<COMPONENT_BUILD_SERVICE_ACCOUNT>"
  params:
    - name: task-revision
      value: "<GIT_COMMIT_SHA>"
    - name: component
      value: "<COMPONENT>"
    - name: baseline-ref
      value: "<BASELINE_REPOSITORY>@sha256:<BASELINE_INDEX_DIGEST>"
    - name: candidate-ref
      value: "<CANDIDATE_REPOSITORY>@sha256:<CANDIDATE_INDEX_DIGEST>"
    # Alternative snapshot-pair mode: retain component above and replace only
    # baseline-ref/candidate-ref with the grouped baseline snapshot you verified
    # and your own candidate snapshot. This mode annotates the candidate:
    # - name: baseline-snapshot
    #   value: "<VERIFIED_BASELINE_SNAPSHOT>"
    # - name: snapshot
    #   value: "<CANDIDATE_SNAPSHOT>"
    # The baseline snapshot must come from an archived Release you already
    # checked yourself: Released=True condition and artifact digests matching
    # the snapshot component images. This pipeline does no archive lookup.
    # Explicit-ref mode only: optionally set snapshot to publish annotations
    # from the release-account task. Without it, logs/results only.
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/red-hat-data-services/aipcc-konflux-data
      - name: revision
        value: "<GIT_COMMIT_SHA>"
      - name: pathInRepo
        value: pipelines/acs-scan-diff.yaml
  timeouts:
    pipeline: 1h20m
