name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container: registry.access.redhat.com/ubi9/python-312
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: pip install pyyaml pytest pytest-mock

      - name: Run unit tests
        run: python3 -m pytest tests/ -v
