kind: Task
apiVersion: tekton.dev/v1
metadata:
  name: select-snapshot-image
spec:
  description: |
    Select one component from the Snapshot and return its container image.

    The Integration Test Scenario passes the whole Snapshot. This task picks the
    component under test and returns the image reference with its digest.
  params:
    - name: SNAPSHOT
      description: Snapshot spec JSON, provided by the ITS.
    - name: component
      description: |
        Component to select. Empty uses the component label of the PipelineRun,
        which the Integration Service sets to the component that triggered the test.
      default: ""
  results:
    - name: component
    - name: container-image
    - name: git-digest
  steps:
    - name: select
      image: quay.io/konflux-ci/release-service-utils@sha256:6ce9a089345bcb8d650d3acb1fbd449e065bd43341e9eaeaec4540a981a5c5a2
      env:
        - name: TARGET_COMPONENT
          value: $(params.component)
        - name: PIPELINE_COMPONENT
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['appstudio.openshift.io/component']
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: COMPONENT_RESULT
          value: $(results.component.path)
        - name: IMAGE_RESULT
          value: $(results.container-image.path)
        - name: DIGEST_RESULT
          value: $(results.git-digest.path)
      script: |
        #!/bin/bash
        set -e

        COMPONENT="${TARGET_COMPONENT}"
        if [ -z "${COMPONENT}" ]; then
          COMPONENT="${PIPELINE_COMPONENT}"
        fi
        if [ -z "${COMPONENT}" ]; then
          echo "ERROR: no component. Set the component param or run from a PipelineRun with a component label."
          exit 1
        fi
        echo "component: ${COMPONENT}"

        ENTRY=$(jq -c --arg name "${COMPONENT}" '.components[] | select(.name == $name)' <<< "${SNAPSHOT}")
        if [ -z "${ENTRY}" ]; then
          echo "ERROR: component ${COMPONENT} is not in the Snapshot. Components:"
          jq -r '.components[].name' <<< "${SNAPSHOT}"
          exit 1
        fi

        IMAGE=$(jq -r '.containerImage // empty' <<< "${ENTRY}")
        if [ -z "${IMAGE}" ]; then
          echo "ERROR: component ${COMPONENT} has no container image in the Snapshot."
          exit 1
        fi
        DIGEST=$(jq -r '.source.git.revision // empty' <<< "${ENTRY}")

        echo "image: ${IMAGE}"
        echo "git digest: ${DIGEST}"

        printf '%s' "${COMPONENT}" > "${COMPONENT_RESULT}"
        printf '%s' "${IMAGE}" > "${IMAGE_RESULT}"
        printf '%s' "${DIGEST}" > "${DIGEST_RESULT}"
