kind: Task
apiVersion: tekton.dev/v1
metadata:
  name: test-inference
spec:
  params:
    - name: inference-server-image
      description: Inference server container image to use for testing
    - name: variant
      description: Variant type (e.g., cuda-ubi9, cpu-ubi9)
    - name: debug
      default: "false"
    - name: host-access-secret-name
    - name: model-names
      type: array
      default: []
    - name: start-rhaiis
      default: "true"
      description: Start the RHAIIS container before testing the models (set to false when testing RHEL AI)
    - name: use-sudo
      default: "false"
      description: Use sudo to execute podman commands (set to true when testing RHEL AI)
  steps:
    - image: quay.io/konflux-ci/release-service-utils@sha256:2f9e6863e82bbc9ddce5a290f3fd0e87657c475e3de8a832b2ef7f8d0671e7d3
      args: ["$(params.model-names[*])"]
      env:
        - name: HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: "$(params.host-access-secret-name)"
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: "$(params.host-access-secret-name)"
      volumeMounts:
        - name: ssh-key
          mountPath: /mnt/ssh-key
      script: |
        #!/bin/bash
        set -e

        INFERENCE_SERVER_IMAGE="$(params.inference-server-image)"
        VARIANT="$(params.variant)"
        echo -e "\n=== Using inference server image: ${INFERENCE_SERVER_IMAGE} ==="
        echo -e "=== Variant: ${VARIANT} ==="

        start_rhaiis() {
          local model_name=$1
          local model_path_in_container=$2

          echo -e "\n=== Removing existing RHAIIS container ==="
          ${ssh_cmd} ${sudo_cmd} podman stop -i rhaii
          ${ssh_cmd} ${sudo_cmd} podman rm -i rhaii

          # Configure variant-specific flags
          GPU_DEVICE_FLAGS=""
          GPU_PARALLEL_FLAGS=""
          VARIANT_EXTRA_FLAGS="--enforce-eager"

          if [[ "${VARIANT}" =~ cpu ]]; then
            echo -e "\n=== Configuring for CPU variant ==="
            # No GPU flags needed
          elif [[ "${VARIANT}" =~ cuda ]]; then
            echo -e "\n=== Configuring for CUDA variant ==="
            GPU_DEVICE_FLAGS="--device nvidia.com/gpu=all"
            NUMBER_OF_GPUS=$(${ssh_cmd} "nvidia-smi --list-gpus | wc -l")
            echo "=== Number of GPUs: ${NUMBER_OF_GPUS} ==="
            GPU_PARALLEL_FLAGS="--tensor-parallel-size ${NUMBER_OF_GPUS}"
          elif [[ "${VARIANT}" =~ neuron ]]; then
            echo -e "\n=== Configuring for Neuron variant ==="
            # Map all available Neuron devices into the container
            NEURON_DEVICES=$(${ssh_cmd} "ls -1 /dev/neuron* 2>/dev/null")
            for dev in ${NEURON_DEVICES}; do
              GPU_DEVICE_FLAGS="${GPU_DEVICE_FLAGS} --device=${dev}"
            done
            echo "=== Neuron device flags: ${GPU_DEVICE_FLAGS} ==="
            # Get number of NeuronCores for tensor-parallel-size
            NUMBER_OF_CORES=$(${ssh_cmd} "neuron-ls --json-output 2>/dev/null | jq '[.[].nc_count] | add'" || echo "2")
            echo "=== Number of Neuron cores: ${NUMBER_OF_CORES} ==="
            GPU_PARALLEL_FLAGS="--tensor-parallel-size ${NUMBER_OF_CORES}"
            # Neuron-specific vLLM flags per Red Hat AI Inference Server docs:
            # --no-enable-prefix-caching: required for Neuron hardware
            # --max-num-seqs 1: recommended for stability
            # --additional-config: override async_mode for stability
            VARIANT_EXTRA_FLAGS="--no-enable-prefix-caching --max-num-seqs 1 --additional-config '{\"override_neuron_config\": {\"async_mode\": false}}'"
          elif [[ "${VARIANT}" =~ rocm ]]; then
            echo -e "\n=== Configuring for ROCm variant ==="
            GPU_DEVICE_FLAGS="--device /dev/kfd --device /dev/dri --security-opt seccomp=unconfined"
            NUMBER_OF_GPUS=$(${ssh_cmd} "rocminfo | grep -c 'Device Type:.*GPU' || echo 1")
            echo "=== Number of GPUs: ${NUMBER_OF_GPUS} ==="
            GPU_PARALLEL_FLAGS="--tensor-parallel-size ${NUMBER_OF_GPUS}"
          else
            echo -e "\n=== Unknown variant, assuming CPU ==="
            # No GPU flags needed
          fi

          echo -e "\n=== Starting RHAIIS container ==="
          ${ssh_cmd} ${sudo_cmd} podman run -d --name rhaii \
            --log-level=debug \
            --env HF_DEBUG=1 \
            --env=VLLM_LOGGING_LEVEL=DEBUG \
            ${GPU_DEVICE_FLAGS} \
            --security-opt=label=disable \
            --shm-size=8g \
            --network=host \
            --userns=keep-id:uid=1001 \
            --env "HF_HUB_OFFLINE=1" \
            --env "VLLM_NO_USAGE_STATS=1" \
            -v "${REMOTE_MODELS_REAL}:/models" \
            "${INFERENCE_SERVER_IMAGE}" \
            ${GPU_PARALLEL_FLAGS} \
            --model "${model_path_in_container}" \
            --served-model-name "${model_name}" \
            --max-model-len 1024 \
            ${VARIANT_EXTRA_FLAGS}
        }

        wait_for_rhaiis() {
          max_attempts=20
          attempt=1
          while [ $attempt -lt $max_attempts ]; do
            echo -e "\n=== Waiting for RHAIIS container to be ready $attempt/$max_attempts ==="
            container_state=$(${ssh_cmd} "${sudo_cmd} podman inspect -f '{{.State.Running}}' rhaii")
            if [[ "${container_state}" == "false" ]]; then
              echo "Container is not running!"
              echo "==="

              # Variant-specific GPU diagnostics
              if [[ "${VARIANT}" =~ cuda ]]; then
                ${ssh_cmd} nvidia-smi || true
                echo "==="
                ${ssh_cmd} "nvidia-smi --query-gpu=memory.free --format=csv" || true
              elif [[ "${VARIANT}" =~ neuron ]]; then
                ${ssh_cmd} neuron-ls || true
              elif [[ "${VARIANT}" =~ rocm ]]; then
                ${ssh_cmd} amd-smi || true
                echo "==="
                ${ssh_cmd} rocminfo || true
              fi

              echo "==="
              ${ssh_cmd} ${sudo_cmd} podman inspect rhaii | jq '.[0].State'
              echo "==="
              ${ssh_cmd} ${sudo_cmd} podman logs --tail 1000 rhaii
              echo "==="
              if [ "$(params.debug)" == "true" ]; then
                echo -e "\n=== Sleeping for 60 minutes ==="
                sleep 3600
              fi
              exit 1
            fi

            if ${ssh_cmd} "curl --no-progress-meter -f http://localhost:8000/health > /dev/null 2>&1"; then
              echo "Container is ready!"
              break
            fi

            attempt=$((attempt + 1))
            echo "Container not ready yet, waiting 30 seconds..."

            # Variant-specific monitoring during wait
            if [[ "${VARIANT}" =~ cuda ]]; then
              echo "GPU memory free:"
              ${ssh_cmd} "nvidia-smi --query-gpu=memory.free --format=csv" || true
            elif [[ "${VARIANT}" =~ neuron ]]; then
              echo "Neuron GPU status:"
              ${ssh_cmd} neuron-ls || true
            elif [[ "${VARIANT}" =~ rocm ]]; then
              echo "ROCm GPU status:"
              ${ssh_cmd} "amd-smi metric -u" || true
            fi

            echo "==="
            echo "Free memory:"
            ${ssh_cmd} "free -m"
            echo "==="
            echo "Last 5 lines of logs:"
            ${ssh_cmd} ${sudo_cmd} podman logs --tail 5 rhaii
            sleep 30
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "Container failed to become ready within $(($max_attempts * 30)) seconds"
            echo -e "\n=== Podman logs ==="
            ${ssh_cmd} ${sudo_cmd} podman logs rhaii
            exit 1
          fi
        }

        test_inference() {
          local model_name=$1

          echo -e "\n=== Prompting RHAIIS container ==="
          DATA='{"prompt": "What is the capital of France?", "max_tokens": 50, "temperature": 0.0}'
          RESPONSE=$(${ssh_cmd} "curl --no-progress-meter -X POST -H 'Content-Type: application/json' -d '${DATA}' http://localhost:8000/v1/completions")
          echo -e "\n=== Response JSON ==="
          echo "${RESPONSE}" | jq

          echo -e "\n=== Verifying response ==="
          TEXT=$(echo "${RESPONSE}" | jq -r '.choices[0].text')
          VERIFICATION_FAILED=0
          if echo "${TEXT}" | grep -i "paris" > /dev/null; then
            echo "✓ Verification passed: Response contains 'Paris'"
          else
            echo "✗ Verification failed: Response does not contain 'Paris'"
            echo "Actual response text: ${TEXT}"
            VERIFICATION_FAILED=1
          fi

          if [ $VERIFICATION_FAILED -eq 1 ]; then
            echo "✗ Model ${model_name} failed verification"
            return 1
          fi

          echo "✓ Model ${model_name} passed all tests"
          return 0
        }

        echo -e "\n=== Preparing SSH private key ==="
        cp /mnt/ssh-key/id_rsa id_rsa
        chmod 400 id_rsa
        ssh_cmd="ssh -i id_rsa -o StrictHostKeyChecking=no -o BatchMode=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=10 ${USERNAME}@${HOST}"
        ${ssh_cmd} cat /etc/redhat-release

        if [ "$(params.use-sudo)" == "true" ]; then
          sudo_cmd="sudo"
        else
          sudo_cmd=""
        fi

        # Determine remote home directory
        REMOTE_HOME="$(${ssh_cmd} 'echo $HOME')"
        echo -e "\n=== Remote home directory: ${REMOTE_HOME} ==="

        # Resolve the real path of ~/models in case it is a symlink (e.g. -> /mnt/models)
        REMOTE_MODELS_REAL="$(${ssh_cmd} 'readlink -f ~/models 2>/dev/null || echo $HOME/models')"
        echo -e "=== Remote models real path: ${REMOTE_MODELS_REAL} ==="

        # Variant-specific initialization checks
        if [[ "${VARIANT}" =~ cuda ]]; then
          # Used on p5.48xlarge, maybe on p4d.24xlarge
          # https://issues.redhat.com/browse/AIPCC-5636
          echo -e "\n=== nvidia-smi nvlink --status ==="
          ${ssh_cmd} nvidia-smi nvlink --status || true

          NUMBER_OF_GPUS=$(${ssh_cmd} "nvidia-smi --list-gpus | wc -l")
          echo -e "\n=== Number of GPUs ==="
          echo "${NUMBER_OF_GPUS}"
        elif [[ "${VARIANT}" =~ neuron ]]; then
          echo -e "\n=== neuron-ls ==="
          ${ssh_cmd} neuron-ls || true

          echo -e "\n=== Neuron devices ==="
          ${ssh_cmd} ls -la /dev/neuron* || true

          NUMBER_OF_CORES=$(${ssh_cmd} "neuron-ls --json-output 2>/dev/null | jq '[.[].nc_count] | add'" || echo "2")
          echo -e "\n=== Number of Neuron cores ==="
          echo "${NUMBER_OF_CORES}"
        elif [[ "${VARIANT}" =~ rocm ]]; then
          echo -e "\n=== amd-smi ==="
          ${ssh_cmd} amd-smi || true

          echo -e "\n=== rocminfo ==="
          ${ssh_cmd} rocminfo || true

          NUMBER_OF_GPUS=$(${ssh_cmd} "rocminfo | grep -c 'Device Type:.*GPU' || echo 1")
          echo -e "\n=== Number of GPUs ==="
          echo "${NUMBER_OF_GPUS}"
        fi

        for model in "$@"; do
          echo -e "\n===================================================="
          echo "=== Testing model: ${model}"
          echo "===================================================="

          # Decide which model path to use:
          #  - If test-model-opt-quantization ran before this task, use the quantized model
          #  - Otherwise, fall back to the regular HuggingFace model
          # This makes test-inference compatible with both scenarios (with and without quantization)
          REMOTE_QUANTIZED_DIR="${REMOTE_MODELS_REAL}/${model}-quantized"
          REMOTE_HF_DIR="${REMOTE_MODELS_REAL}/${model}"

          # Check if quantized model directory exists AND is not empty
          if ${ssh_cmd} "[ -d '${REMOTE_QUANTIZED_DIR}' ] && [ -n \"\$(ls -A '${REMOTE_QUANTIZED_DIR}' 2>/dev/null)\" ]"; then
            echo "Found quantized model at ${REMOTE_QUANTIZED_DIR}, using it"
            MODEL_PATH_IN_CONTAINER="/models/${model}-quantized"
          else
            echo "No quantized model found, using original model at ${REMOTE_HF_DIR}"
            MODEL_PATH_IN_CONTAINER="/models/${model}"
          fi

          if [ "$(params.start-rhaiis)" == "true" ]; then
            if ! start_rhaiis "${model}" "${MODEL_PATH_IN_CONTAINER}"; then
              echo -e "\n✗ Failed to start RHAIIS container for model ${model}"
              exit 1
            fi
          fi

          if ! wait_for_rhaiis; then
            echo -e "\n✗ RHAIIS container failed to become ready"
            exit 2
          fi

          if ! test_inference "${model}"; then
            echo -e "\n✗ Failed to test inference for model ${model}"
            exit 3
          fi
        done

        echo -e "\n✓ All models passed testing"
  volumes:
    - name: ssh-key
      secret:
        secretName: "$(params.host-access-secret-name)"
        items:
          - key: id_rsa
            path: id_rsa
