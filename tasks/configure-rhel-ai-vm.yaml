kind: Task
apiVersion: tekton.dev/v1
metadata:
  name: configure-rhel-ai-vm
spec:
  params:
    - name: host-access-secret-name
    - name: model-name
      description: Name of the model to test
    - name: pull-secret-name
      description: Name of the secret containing docker config for image authentication
    - name: variant
      default: "cuda"
      description: "Variant for image naming, e.g. cuda, rocm"
  steps:
    - image: quay.io/konflux-ci/release-service-utils@sha256:2f9e6863e82bbc9ddce5a290f3fd0e87657c475e3de8a832b2ef7f8d0671e7d3
      env:
        - name: HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: "$(params.host-access-secret-name)"
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: "$(params.host-access-secret-name)"
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token_konflux_ro
              name: "hugging-face"
      volumeMounts:
        - name: auth-file
          mountPath: /mnt/auth-file
        - name: mapt-ssh-key
          mountPath: /mnt/mapt-ssh-key
        - name: shared-ssh-key
          mountPath: /mnt/shared-ssh-key
      script: |
        #!/bin/bash
        set -e
        echo -e "\n=== Preparing SSH private key ==="
        cp /mnt/mapt-ssh-key/id_rsa id_rsa
        chmod 400 id_rsa

        echo -e "\n=== ssh to the VM ${USERNAME}@${HOST} and print OS version ==="
        ssh_cmd="ssh -i id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${USERNAME}@${HOST}"
        ${ssh_cmd} cat /etc/redhat-release

        echo -e "\n=== Adding shared SSH key ==="
        cat /mnt/shared-ssh-key/aipcc.pub | ${ssh_cmd} "cat >> ~/.ssh/authorized_keys"

        VARIANT="$(params.variant)"
        ACCELERATOR="${VARIANT%%-*}"

        if [[ "${ACCELERATOR}" == "cuda" ]]; then
          echo -e "\n=== /proc/driver/nvidia/version ==="
          ${ssh_cmd} cat /proc/driver/nvidia/version

          echo -e "\n=== nvidia-smi ==="
          ${ssh_cmd} nvidia-smi

          NUMBER_OF_GPUS=$( ${ssh_cmd} "nvidia-smi --list-gpus | wc -l")
        elif [[ "${ACCELERATOR}" == "gaudi" ]]; then
          echo -e "\n=== hl-smi ==="
          ${ssh_cmd} hl-smi

          NUMBER_OF_GPUS=$(${ssh_cmd} "ls -1d /dev/accel/accel* 2>/dev/null | grep -v controlD | wc -l" || echo "1")
        elif [[ "${ACCELERATOR}" == "rocm" ]]; then
          echo -e "\n=== amd-smi version ==="
          ${ssh_cmd} amd-smi version

          echo -e "\n=== amd-smi list ==="
          ${ssh_cmd} amd-smi list

          NUMBER_OF_GPUS=$(${ssh_cmd} "rocminfo | grep -c 'Device Type:.*GPU' || echo 1")
        else
          echo "ERROR: Unsupported variant: ${VARIANT}"
          exit 1
        fi

        echo -e "\n=== Number of GPUs: ${NUMBER_OF_GPUS} ==="

        echo -e "\n=== Checking /etc/ostree/auth.json ==="
        ${ssh_cmd} "sudo ls -al /etc/ostree/auth.json || true"

        echo -e "\n=== Copying pull secret ==="
        scp -i id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /mnt/auth-file/auth.json ${USERNAME}@${HOST}:auth.json
        ${ssh_cmd} sudo cp auth.json /etc/ostree/auth.json

        # "podman run" process is killed when ssh session is closed which
        # happens randomly, probably because it runs on OpenShift
        echo -e "\n=== Enabling linger for podman ==="
        ${ssh_cmd} sudo loginctl enable-linger $USERNAME
        ${ssh_cmd} "loginctl show-user $USERNAME | grep Linger"

        echo -e "\n=== Creating quadlet configuration ==="
        config_file="/etc/containers/systemd/rhaiis.container.d/install.conf"
        ${ssh_cmd} sudo cp ${config_file}.example ${config_file}
        ${ssh_cmd} "sudo sed -i 's|\(HUGGING_FACE_HUB_TOKEN=\)[^ ]*|\1${HUGGING_FACE_HUB_TOKEN}|' ${config_file}"
        ${ssh_cmd} "sudo sed -i 's|\(--model \)[^ ]*|\1$(params.model-name)|' ${config_file}"
        ${ssh_cmd} "sudo sed -i 's|\(--tensor-parallel-size \)[^ ]*|\1${NUMBER_OF_GPUS}|' ${config_file}"

        echo -e "\n=== Contents of ${config_file} ==="
        ${ssh_cmd} cat ${config_file} | sed 's|\(HUGGING_FACE_HUB_TOKEN=hf_\)[^ ]*|\1hidden|'

        echo -e "\n=== Reloading systemd ==="
        ${ssh_cmd} sudo systemctl daemon-reload

        echo -e "\n=== Starting rhaiis service==="
        ${ssh_cmd} sudo systemctl start rhaiis
  volumes:
    - name: auth-file
      secret:
        secretName: "$(params.pull-secret-name)"
        items:
          - key: ".dockerconfigjson"
            path: auth.json
    - name: mapt-ssh-key
      secret:
        secretName: "$(params.host-access-secret-name)"
        defaultMode: 0400
        items:
          - key: id_rsa
            path: id_rsa
            mode: 0400
    - name: shared-ssh-key
      secret:
        secretName: "shared-ssh-key"
        defaultMode: 0400
        items:
          - key: id_rsa.pub
            path: aipcc.pub
            mode: 0400