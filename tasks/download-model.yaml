kind: Task
apiVersion: tekton.dev/v1
metadata:
  name: download-model
spec:
  params:
    - name: model-names
      type: array
      description: List of Hugging Face model names to download
    - name: host-access-secret-name
      description: Name of the secret containing SSH credentials
  steps:
    - image: quay.io/konflux-ci/release-service-utils@sha256:2f9e6863e82bbc9ddce5a290f3fd0e87657c475e3de8a832b2ef7f8d0671e7d3
      args: ["$(params.model-names[*])"]
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: token_konflux_ro
              name: "hugging-face"
        - name: HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: "$(params.host-access-secret-name)"
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: "$(params.host-access-secret-name)"
      volumeMounts:
        - name: ssh-key
          mountPath: /mnt/ssh-key
      script: |
        #!/bin/bash
        set -e

        echo -e "\n=== Preparing SSH private key ==="
        cp /mnt/ssh-key/id_rsa id_rsa
        chmod 400 id_rsa
        ssh_cmd="ssh -i id_rsa -o StrictHostKeyChecking=no -o BatchMode=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=10 ${USERNAME}@${HOST}"
        ${ssh_cmd} cat /etc/redhat-release

        echo -e "\n=== Selecting model download location ==="
        # Use /mnt when it is a separate mount with more free space (common on Azure VMs).
        # Fall back to ~/models when /mnt is not a real mount or has less space.
        home_free=$(${ssh_cmd} df --output=avail '$HOME' | tail -1)
        mnt_free=$(${ssh_cmd} df --output=avail /mnt 2>/dev/null | tail -1 || echo 0)
        if [ -n "$mnt_free" ] && [ "$mnt_free" -gt "$home_free" ]; then
          ${ssh_cmd} 'mkdir -p /mnt/models && rm -rf ~/models && ln -s /mnt/models ~/models'
          echo "Using /mnt/models ($(( mnt_free / 1024 / 1024 )) GiB free)"
        else
          ${ssh_cmd} mkdir -p '~/models'
          echo "Using ~/models ($(( home_free / 1024 / 1024 )) GiB free)"
        fi

        echo -e "\n=== Downloading models ==="
        for model_name in "$@"; do
          echo -e "\n--- Downloading model: ${model_name} ---"
          ${ssh_cmd} mkdir -p models/${model_name}
          ${ssh_cmd} chmod g+rwX models/${model_name}
          ${ssh_cmd} hf download ${model_name} --local-dir models/${model_name} --token $HF_TOKEN
        done

        echo -e "\n=== Disk usage summary ==="
        ${ssh_cmd} du -h models

        echo -e "\n✓ All models downloaded successfully"

  volumes:
    - name: ssh-key
      secret:
        secretName: "$(params.host-access-secret-name)"
        items:
          - key: id_rsa
            path: id_rsa
