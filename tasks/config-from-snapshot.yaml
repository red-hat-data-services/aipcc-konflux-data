kind: Task
apiVersion: tekton.dev/v1
metadata:
  name: config-from-snapshot
spec:
  params:
    - name: architecture
      default: "x86_64"
      description: Architecture, e.g. x86_64, aarch64
    - name: component
    - name: SNAPSHOT
  results:
    - name: cloud-provider
      description: Cloud provider, e.g. aws, ibm, gcp, azure
    - name: container-image
      description: Full reference to the container image to test, including the registry and the sha digest
    - name: event-type
      description: Value of label pac.test.appstudio.openshift.io/event-type from the snapshot
    - name: git-digest
      description: Full git commit digest from the snapshot
    - name: inference-server-image
      description: Full reference to the inference server image, always populated for rhaiis
    - name: mapt-architecture
      description: Architecture string usable in mapt (aarch64 -> arm64)
    - name: model-opt-image
      description: Full reference to the model-opt container image, empty if not testing model-opt
    - name: product-image
      description: Short product image name, e.g. rhaiis or rhaiis-model-opt
    - name: variant
      description: Variant, e.g. cuda-ubi9, gaudi-ubi9, neuron-ubi9, rocm-ubi9, spyre-ubi9, tpu-ubi9, cpu-ubi9
    - name: vm-types
      description: Comma-separated list of VM types based on variant
  steps:
    - name: parse-snapshot-components
      image: quay.io/konflux-ci/release-service-utils@sha256:f20039acb05d0c96a14d64517c3a0edaf4a0245529709e25db930d7a9bbe82a4
      workingDir: /workspace
      env:
        - name: COMPONENT
          value: $(params.component)
        - name: EVENT_TYPE
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['pac.test.appstudio.openshift.io/event-type']
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      script: |
        #!/bin/bash
        set -e

        snapshotComponents=$(jq -c '.components[]' <<< "${SNAPSHOT}")
        productImage=${COMPONENT%-*-*}

        while read componentEntry
        do
          # TODO should we compare revisions across components in snapshot? Is it available in pipeline run labels/annotations?
          componentName=$(echo "${componentEntry}" | jq -r '.name')
          echo -e "\n === Processing component ${componentName} ==="
          if [[ "${componentName}" != "${COMPONENT}" ]]; then
            continue
          fi

          containerImage=$(echo "${componentEntry}" | jq -r '.containerImage')
          gitDigest=$(echo "${componentEntry}" | jq -r '.source.git.revision')

          echo -e "\n === Found image for ${componentName} in the snapshot ==="
          echo ${containerImage}
          break
        done < <(echo "$snapshotComponents")

        if [ -z "${componentName}" ]; then
          echo "Component ${COMPONENT} not found in the snapshot!"
          exit 1
        fi

        # cloud-specific artefacts (e.g. disk images) need to run on specific cloud providers
        case "${COMPONENT}" in
          *-aws*)
            cloud_provider="aws"
            ;;
          *-azure*)
            cloud_provider="azure"
            ;;
          *-gcp*)
            cloud_provider="gcp"
            ;;
          *)
            # all other types of artefacts can run on any cloud provider, will be decided below based on variant
            cloud_provider=""
            ;;
        esac

        ret_value=0

        # TODO update lists based on architecture
        case "${COMPONENT}" in
          *-cuda*)
            variant="cuda-ubi9"

            if [[ "${cloud_provider}" == "aws" ]] || [[ -z "${cloud_provider}" ]]; then
              # g4dn has 14 GB of GPU memory which is not enough, 12xlarge has 4 GPU, metal has 8 GPU
              # p5.48xlarge, p5e.48xlarge,p5en.48xlarge, p4d.24xlarge, p4de.24xlarge has 8 GPU, failed on system not initalized (NVSwitch not configured???)
              # p6-b200.48xlarge, p6e-gb200.36xlarge - not tested, extremely expensive $20+ per hour spot, $100+ on-demand

              # also usable but not listed because mapt only checks 8 instance types at a time
              # g4dn.12xlarge,g4dn.metal,g5.8xlarge,g5.12xlarge,g5.16xlarge,g5.24xlarge,g5.48xlarge
              # g6.8xlarge,g6.12xlarge,g6.16xlarge,g6.24xlarge,g6.48xlarge
              # g6e.4xlarge,g6e.8xlarge,g6e.12xlarge,g6e.16xlarge,g6e.24xlarge,g6e.48xlarge,gr6.8xlarge,p5.4xlarge

              cloud_provider="aws" # might have been empty
              if [[ "$(params.architecture)" == "x86_64" ]]; then
                vm_types="g5.xlarge,g5.2xlarge,g5.4xlarge,g6.xlarge,g6.2xlarge,g6.4xlarge,g6e.xlarge,gr6.4xlarge"
              elif [[ "$(params.architecture)" == "aarch64" ]]; then
                vm_types="g5g.2xlarge,g5g.4xlarge,g5g.8xlarge,g5g.16xlarge"
              else
                echo "Architecture $(params.architecture) not supported for CUDA on AWS"
                ret_value=1
              fi
            else
              echo "Cloud provider ${cloud_provider} not supported for CUDA"
              ret_value=1
            fi
            ;;
          *-gaudi*)
            echo "Gaudi not implemented yet"
            vm_types="dl1.24xlarge"
            cloud_provider="aws"
            variant="gaudi-ubi9"
            ret_value=1
            ;;
          *-neuron*)
            variant="neuron-ubi9"

            if [[ "${cloud_provider}" == "aws" ]] || [[ -z "${cloud_provider}" ]]; then
              # instances with at least 16 GiB of GPU memory with reasonable price
              vm_types="inf1.2xlarge,inf1.6xlarge,inf1.24xlarge,inf2.xlarge,inf2.8xlarge,trn1.2xlarge"
              cloud_provider="aws" # might have been empty
            else
              echo "Cloud provider ${cloud_provider} not supported for Neuron"
              ret_value=1
            fi
            ;;
          *-rocm*)
            variant="rocm-ubi9"

            if [[ "${cloud_provider}" == "azure" ]] || [[ -z "${cloud_provider}" ]]; then
              # Azure GPU-enabled VMs with AMD MI300X GPUs
              # Standard_ND96is_MI300X_v5 - 96 vCPUs, 1.9 TB RAM, 8x MI300X GPUs (InfiniBand)
              # Standard_ND96isr_MI300X_v5 - 96 vCPUs, 1.9 TB RAM, 8x MI300X GPUs (InfiniBand + RDMA)
              # Only Azure provides AMD MI300X GPUs required for ROCm testing
              vm_types="Standard_ND96is_MI300X_v5,Standard_ND96isr_MI300X_v5"
              cloud_provider="azure"
            elif [[ "${cloud_provider}" == "aws" ]]; then
              # AWS AMD GPUs (g4ad series) use older Radeon Pro V520
              # Not suitable for MI300X testing, but kept for compatibility
              echo "⚠ AWS g4ad instances use Radeon Pro V520, not MI300X - testing may be limited"
              vm_types="g4ad.xlarge,g4ad.2xlarge,g4ad.4xlarge,g4ad.8xlarge,g4ad.16xlarge"
              cloud_provider="aws"
            else
              echo "Cloud provider ${cloud_provider} not supported for ROCm"
              ret_value=1
            fi
            ;;
          *-spyre*)
            echo "Spyre not implemented yet"
            cloud_provider="ibm"
            variant="spyre-ubi9"
            ret_value=1
            ;;
          *-tpu*)
            echo "TPU not implemented yet"
            cloud_provider="gcp"
            variant="tpu-ubi9"
            ret_value=1
            ;;
          *-cpu*)
            variant="cpu-ubi9"

            if [[ "${cloud_provider}" == "aws" ]] || [[ -z "${cloud_provider}" ]]; then
              # General purpose and compute-optimized instances without GPU
              # Using instances with sufficient memory for model inference
              # For 8B models, prefer 4xlarge+ (64GB+ RAM). For 2B models, 2xlarge+ (32GB+) is sufficient
              vm_types="m5.4xlarge,m6i.4xlarge,m5.2xlarge,m6i.2xlarge,c5.4xlarge,c6i.4xlarge,c5.2xlarge,c6i.2xlarge"
              cloud_provider="aws" # might have been empty
            else
              echo "Cloud provider ${cloud_provider} not supported for CPU"
              ret_value=1
            fi
            ;;
          *)
            echo "Variant ${variant} not supported"
            exit 1
            ;;
        esac

        # Determine model-opt-image and inference-server-image (only for rhaiis)
        model_opt_image=""
        inference_server_image=""

        if [[ "${COMPONENT}" == "rhaiis-model-opt-"* ]]; then
          # Testing model-opt component
          model_opt_image="${containerImage}"

          echo -e "\n === Extracting inference server image for model-opt ==="
          # For model-opt components, find the corresponding cuda inference image
          inference_component="${COMPONENT/model-opt-/}"
          echo "Looking for inference component: ${inference_component}"

          inference_server_image=$(echo "${SNAPSHOT}" | jq -r --arg comp "${inference_component}" \
            '.components[] | select(.name==$comp) | .containerImage' || echo "")

          if [ -n "${inference_server_image}" ]; then
            echo "✓ Found inference server image: ${inference_server_image}"
          else
            echo "⚠ No inference server image found for ${inference_component}"
          fi
        elif [[ "${COMPONENT}" == rhaiis-* ]]; then
          # Testing regular rhaiis component (not model-opt)
          inference_server_image="${containerImage}"
          echo -e "\n === Using container image as inference server image ==="
          echo "${inference_server_image}"
        fi

        if [[ "$(params.architecture)" == "aarch64" ]]; then
          mapt_architecture="arm64"
        else
          mapt_architecture="$(params.architecture)"
        fi

        echo -e "\n === Storing results ==="
        # we need to store task results even if the task fails
        echo -n "${cloud_provider}" | tee $(results.cloud-provider.path)
        echo -n "${containerImage}" | tee $(results.container-image.path)
        echo -n "${gitDigest}" | tee $(results.git-digest.path)
        echo -n "${EVENT_TYPE}" | tee $(results.event-type.path)
        echo -n "${inference_server_image}" | tee $(results.inference-server-image.path)
        echo -n "${mapt_architecture}" | tee $(results.mapt-architecture.path)
        echo -n "${model_opt_image}" | tee $(results.model-opt-image.path)
        echo -n "${productImage}" | tee $(results.product-image.path)
        echo -n "${variant}" | tee $(results.variant.path)
        echo -n "${vm_types}" | tee $(results.vm-types.path)

        exit ${ret_value}
        