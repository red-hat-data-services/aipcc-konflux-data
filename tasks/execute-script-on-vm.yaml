kind: Task
apiVersion: tekton.dev/v1
metadata:
  name: execute-script-on-vm
spec:
  params:
    - name: debug
      default: "false"
    - name: host-access-secret-name
    - name: script
      default: | 
        #!/bin/bash
        set -e
    - name: wait-for-connection
      description: Wait for the VM to be available before executing the script, useful after a reboot.
      default: "false"
  steps:
    - image: quay.io/konflux-ci/release-service-utils@sha256:067f6f54dfa13e1c01b4a5b44aa82dbe027a003b8e0ffa21d77004bcac6b8370
      env:
        - name: HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: "$(params.host-access-secret-name)"
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: "$(params.host-access-secret-name)"
      volumeMounts:
        - name: ssh-key
          mountPath: /mnt/ssh-key
      script: |
        #!/bin/bash
        set -e

        echo -e "\n=== Preparing SSH private key ==="
        cp /mnt/ssh-key/id_rsa id_rsa
        chmod 400 id_rsa

        HOST=$(echo "${HOST}" | tr -d '\n\r')
        USERNAME=$(echo "${USERNAME}" | tr -d '\n\r')

        ssh_cmd="ssh -i id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=10 ${USERNAME}@${HOST}"

        if [[ "$(params.wait-for-connection)" == "true" ]]; then
          echo -e "\n=== Waiting for the VM to be available ==="
          # VM restart quickly but bare metal VMs need some time to be ready
          for i in $(seq 1 20); do
            if ${ssh_cmd} true >/dev/null 2>&1; then
              ${ssh_cmd} "until systemctl is-system-running --wait >/dev/null 2>&1; do sleep 2; done"
              break
            fi

            echo -e "\n=== System is not ready, sleeping for 30 seconds $i/10 ==="
            sleep 30
          done
        fi

        echo -e "\n=== Executing script on VM ==="
        ${ssh_cmd} '$(params.script)'

  volumes:
    - name: ssh-key
      secret:
        secretName: "$(params.host-access-secret-name)"
        items:
          - key: id_rsa
            path: id_rsa
