kind: Task
apiVersion: tekton.dev/v1
metadata:
  name: pull-image
spec:
  params:
    - name: container-images
      type: array
      description: List of container images to pull
    - name: host-access-secret-name
      description: Name of the secret containing SSH credentials
    - name: pull-secret-names
      type: array
      default:
        - "global-pull-secret"
      description: List of pull secret names for image authentication
  steps:
    - name: prepare-auth
      image: quay.io/konflux-ci/release-service-utils@sha256:04f3b2f47223a0fd06c688544fadd42473450224ad1fcb7c92afd2cbf5cc1030
      args: ["$(params.pull-secret-names[*])"]
      script: |
        #!/bin/bash
        set -e

        echo -e "\n=== Preparing auth file ==="
        echo '{}' > /workspace/auth.json
        for secret_name in "$@"; do
          echo "Fetching pull secret: ${secret_name}"
          secret_json=$(kubectl get secret "${secret_name}" -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d)
          jq -s '.[0] * .[1]' /workspace/auth.json <(echo "${secret_json}") > /workspace/auth-merged.json
          mv /workspace/auth-merged.json /workspace/auth.json
        done
        echo "✓ Auth file ready"

    - name: pull-images
      image: quay.io/konflux-ci/release-service-utils@sha256:04f3b2f47223a0fd06c688544fadd42473450224ad1fcb7c92afd2cbf5cc1030
      args: ["$(params.container-images[*])"]
      env:
        - name: HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: "$(params.host-access-secret-name)"
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: "$(params.host-access-secret-name)"
      volumeMounts:
        - name: ssh-key
          mountPath: /mnt/ssh-key
      script: |
        #!/bin/bash
        set -e

        echo -e "\n=== Preparing SSH private key ==="
        cp /mnt/ssh-key/id_rsa id_rsa
        chmod 400 id_rsa

        HOST=$(echo "${HOST}" | tr -d '\n\r')
        USERNAME=$(echo "${USERNAME}" | tr -d '\n\r')

        ssh_cmd="ssh -i id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=10 ${USERNAME}@${HOST}"
        ${ssh_cmd} cat /etc/redhat-release

        echo -e "\n=== Uploading auth file ==="
        scp -i id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /workspace/auth.json ${USERNAME}@${HOST}:auth.json
        ${ssh_cmd} ls -al auth.json

        echo -e "\n=== Pulling images ==="
        for image in "$@"; do
          # Skip empty image names
          if [ -z "${image}" ]; then
            echo -e "\n--- Skipping empty image name ---"
            continue
          fi
          echo -e "\n--- Pulling image: ${image} ---"
          ${ssh_cmd} podman pull --authfile auth.json "${image}"
        done

        echo -e "\n✓ All images pulled successfully"

  volumes:
    - name: ssh-key
      secret:
        secretName: "$(params.host-access-secret-name)"
        items:
          - key: id_rsa
            path: id_rsa
