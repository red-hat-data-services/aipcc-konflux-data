apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: konflux-pipeline-failure-notification
  annotations:
    tekton.dev/description: |
      Troubleshoots a failed Konflux PipelineRun using AI (claudio) and sends
      a Slack notification with the root cause analysis.
      Composes the claudio-run and slack-notification StepActions.
spec:
  params:
    - name: prompt
      type: string
      default: |
        You are running as a finally task in a Konflux PipelineRun that has failed.
        Use kubectl to discover which PipelineRun in your namespace has failed, then inspect its TaskRun conditions and pod logs.
        Troubleshoot the root cause and write a 1-2 sentence summary to /home/claudio/output/output.txt.
      description: Prompt for claudio troubleshooting. Callers should pass this explicitly using $(context.pipelineRun.name) for better context.

    - name: header
      type: string
      default: ""
      description: Slack notification header (e.g. 'RHAIIS Test Pipeline Failed'). If empty, falls back to 'Konflux Pipeline Failed'.

    - name: openshift-console-url
      type: string
      default: "https://console-openshift-console.apps.mpp-e1-preprod.syvu.p1.openshiftapps.com"
      description: Base URL for the OpenShift console (used when application-name is not set)

    - name: konflux-base-url
      type: string
      default: "https://konflux-ui.apps.stone-prod-p02.hjvn.p1.openshiftapps.com"
      description: Base URL for the Konflux UI (used when application-name is set)

    - name: slack-secret-name
      type: string
      default: "slack-webhook"
      description: Secret containing the Slack webhook URL

    - name: slack-key-name
      type: string
      description: Key within the secret for the webhook URL

    - name: pipeline-name
      type: string
      description: PipelineRun name (use $(context.pipelineRun.name))

    - name: pipeline-namespace
      type: string
      description: PipelineRun namespace (use $(context.pipelineRun.namespace))

    - name: claudio-image
      type: string
      default: "quay.io/aipcc-cicd/claudio:v0.7.3"
      description: Claudio container image

    - name: gcp-credentials
      type: string
      default: "claudio-adc"
      description: Secret holding GCP Vertex AI credentials

    - name: git-resolver-token-secret
      type: string
      default: "pipelines-as-code-secret"
      description: Secret name containing the token for the git resolver

    - name: git-resolver-token-key
      type: string
      default: "password"
      description: Key within the git resolver token secret

    - name: application-name
      type: string
      default: ""
      description: Konflux application name (used in the PipelineRun UI link). If empty, omitted from the URL.

    - name: claudio-extra-args
      type: array
      default:
        - "--allowedTools"
        - "Bash(kubectl get *)"
        - "Bash(kubectl describe *)"
        - "Bash(kubectl logs *)"
        - "Bash(curl *)"
        - "Write"
        - "Bash(cat *)"
        - "Bash(env)"
        - "Bash(printenv *)"
        - "Bash(ls *)"
        - "Bash(head *)"
        - "Bash(tail *)"
        - "Read"
        - "Glob"
        - "Grep"
      description: Extra arguments passed to entrypoint (default allows read-only kubectl + curl + filesystem read + write)

  volumes:
    - name: gcp-credentials
      secret:
        secretName: $(params.gcp-credentials)
    - name: slack-webhook
      secret:
        secretName: $(params.slack-secret-name)
    - name: claudio-output
      emptyDir: {}

  steps:
    - name: claudio
      onError: continue
      ref:
        resolver: git
        params:
          - name: org
            value: redhat
          - name: repo
            value: rhel-ai/konflux-data
          - name: scmType
            value: gitlab
          - name: serverURL
            value: https://gitlab.com
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/claudio-run.yaml
          - name: token
            value: $(params.git-resolver-token-secret)
          - name: tokenKey
            value: $(params.git-resolver-token-key)
      params:
        - name: prompt
          value: $(params.prompt)
        - name: image
          value: $(params.claudio-image)
        - name: gcp-volume
          value: gcp-credentials
        - name: output-volume
          value: claudio-output
        - name: extra-args
          value:
            - $(params.claudio-extra-args[*])

    - name: build-message
      image: registry.access.redhat.com/ubi9-minimal:latest
      volumeMounts:
        - name: claudio-output
          mountPath: /home/claudio/output
      env:
        - name: PIPELINE_NAME
          value: $(params.pipeline-name)
        - name: PIPELINE_NAMESPACE
          value: $(params.pipeline-namespace)
        - name: KONFLUX_BASE_URL
          value: $(params.konflux-base-url)
        - name: OPENSHIFT_CONSOLE_URL
          value: $(params.openshift-console-url)
        - name: HEADER_OVERRIDE
          value: $(params.header)
        - name: APPLICATION_NAME
          value: $(params.application-name)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        HEADER="${HEADER_OVERRIDE:-Konflux Pipeline Failed}"
        printf '%s' "$HEADER" > $(step.results.header.path)

        if [ -n "${APPLICATION_NAME:-}" ]; then
          PIPELINERUN_URL="${KONFLUX_BASE_URL}/ns/${PIPELINE_NAMESPACE}/applications/${APPLICATION_NAME}/pipelineruns/${PIPELINE_NAME}"
        else
          PIPELINERUN_URL="${OPENSHIFT_CONSOLE_URL}/k8s/ns/${PIPELINE_NAMESPACE}/tekton.dev~v1~PipelineRun/${PIPELINE_NAME}/logs"
        fi
        SUBTITLE="*${PIPELINE_NAME}*  |  <${PIPELINERUN_URL}|View PipelineRun>"
        printf '%s' "$SUBTITLE" > $(step.results.subtitle.path)

        if [ -s /home/claudio/output/output.txt ]; then
          MESSAGE="$(sed '/^$/d' /home/claudio/output/output.txt)"
        fi
        MESSAGE="${MESSAGE:-PipelineRun *${PIPELINE_NAME}* in namespace \`${PIPELINE_NAMESPACE}\` has failed. Automated troubleshooting was unable to determine the root cause.}"
        printf '%s' "$MESSAGE" > $(step.results.message.path)

        TIMESTAMP="$(date -u '+%b %-d, %Y %H:%M UTC')"
        FOOTER=":round_pushpin: ${PIPELINE_NAMESPACE} · ${TIMESTAMP}"
        printf '%s' "$FOOTER" > $(step.results.footer.path)
      results:
        - name: header
        - name: subtitle
        - name: message
        - name: footer

    - name: send-slack
      ref:
        resolver: git
        params:
          - name: org
            value: redhat
          - name: repo
            value: rhel-ai/konflux-data
          - name: scmType
            value: gitlab
          - name: serverURL
            value: https://gitlab.com
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/slack-blockkit-notification.yaml
          - name: token
            value: $(params.git-resolver-token-secret)
          - name: tokenKey
            value: $(params.git-resolver-token-key)
      params:
        - name: message
          value: $(steps.build-message.results.message)
        - name: header
          value: $(steps.build-message.results.header)
        - name: subtitle
          value: $(steps.build-message.results.subtitle)
        - name: footer
          value: $(steps.build-message.results.footer)
        - name: slack-key-name
          value: $(params.slack-key-name)
        - name: slack-volume
          value: slack-webhook
