kind: Task
apiVersion: tekton.dev/v1
metadata:
  name: find-resources-to-prune
spec:
  description: |
    Scans S3 bucket for old mapt and cloud-importer resources, and Azure Blob
    Storage for old Azure cloud-importer images. Finds unassociated Elastic IPs
    created by mapt for release.
    Outputs lists of resources that need cleanup via infra-aws and cloud-importer tasks.
  params:
    - name: image-name-filters
      description: List of substrings that must ALL be present in cloud image names to be considered for cleanup (applies to both AWS AMIs and Azure images)
      type: array
      default:
        - "rhel-ai"
        - "-pr-"
    - name: dry-run
      description: If "true", only log actions without executing cleanup
      default: "false"
      type: string
    - name: ttl-hours-eips
      description: Minimum age in hours for an unassociated Elastic IP to be pruned
      default: "24"
      type: string
    - name: secret-aws-credentials
      description: Name of the secret containing AWS credentials (access-key, secret-key, region, bucket)
      type: string
    - name: secret-az-credentials
      description: Name of the secret containing Azure credentials (client_id, client_secret, tenant_id, subscription_id, location, storage_account, storage_key)
      type: string
      default: "secret-az-credentials"
    - name: ttl-hours-amis
      description: Time-to-live in hours for merge request AMIs before pruning (e.g., "72" for 3 days)
      type: string
    - name: ttl-hours-vms
      description: Time-to-live in hours for resources before pruning (e.g., "168" for 7 days)
      type: string
    - name: ttl-hours-azure-images
      description: Time-to-live in hours for Azure test images before pruning (e.g., "72" for 3 days)
      type: string
      default: "72"
  results:
    - name: rhel-resources
      description: Array of RHEL resource IDs to cleanup
      type: array
    - name: rhel-ai-resources
      description: Array of RHEL AI resource IDs to cleanup
      type: array
    - name: fedora-resources
      description: Array of Fedora resource IDs to cleanup
      type: array
    - name: ocp-snc-resources
      description: Array of OCP SNC (OpenShift Single Node Cluster) resource IDs to cleanup
      type: array
    - name: aws-cloud-importer-resources
      description: Array of AWS cloud-importer resource IDs to cleanup
      type: array
    - name: azure-cloud-importer-resources
      description: Array of Azure cloud-importer resource IDs to cleanup
      type: array
    - name: unassociated-eips
      description: Array of region|allocation-id values for unassociated, mapt-owned AWS Elastic IPs to release
      type: array
  steps:
    - name: check-s3-bucket
      image: quay.io/aipcc-cicd/cloud-importer:v0.0.4
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: $(params.secret-aws-credentials)
              key: access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.secret-aws-credentials)
              key: secret-key
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: $(params.secret-aws-credentials)
              key: region
        - name: AWS_BUCKET
          valueFrom:
            secretKeyRef:
              name: $(params.secret-aws-credentials)
              key: bucket
        - name: DRY_RUN
          value: $(params.dry-run)
        - name: TTL_HOURS_AMIS
          value: $(params.ttl-hours-amis)
        - name: TTL_HOURS_VMS
          value: $(params.ttl-hours-vms)
        - name: TTL_HOURS_EIPS
          value: $(params.ttl-hours-eips)
      args:
        - $(params.image-name-filters[*])
      script: |
        #!/usr/bin/env python3
        import os
        import json
        import subprocess
        import sys
        from datetime import datetime, timezone, timedelta

        # Configuration
        ami_name_filters = sys.argv[1:]  # Get filters from command line arguments
        dry_run = os.environ['DRY_RUN'].lower() == 'true'
        bucket = os.environ['AWS_BUCKET']
        ttl_hours_amis = int(os.environ['TTL_HOURS_AMIS'])
        ttl_hours_vms = int(os.environ['TTL_HOURS_VMS'])
        ttl_hours_eips = int(os.environ['TTL_HOURS_EIPS'])

        cutoff_date_vms = datetime.now(timezone.utc) - timedelta(hours=ttl_hours_vms)
        cutoff_date_amis = datetime.now(timezone.utc) - timedelta(hours=ttl_hours_amis)

        print(f"\n=== Resource Pruner Configuration ===")
        print(f"S3 Bucket: {bucket}")
        print(f"AMI Name Filters: {ami_name_filters}")
        print(f"TTL for VMs: {ttl_hours_vms} hours ({ttl_hours_vms / 24:.1f} days)")
        print(f"Cutoff date for VMs: {cutoff_date_vms.isoformat()}")
        print(f"TTL for AMIs: {ttl_hours_amis} hours ({ttl_hours_amis / 24:.1f} days)")
        print(f"Cutoff date for AMIs: {cutoff_date_amis.isoformat()}")
        print(f"TTL for EIPs: {ttl_hours_eips} hours ({ttl_hours_eips / 24:.1f} days)")
        print(f"Dry run mode: {dry_run}")
        print("=" * 50)

        def run_aws_command(cmd):
            """Execute AWS CLI command and return JSON output"""
            try:
                result = subprocess.run(
                    cmd,
                    shell=True,
                    capture_output=True,
                    text=True,
                    check=True
                )
                return json.loads(result.stdout) if result.stdout.strip() else None
            except subprocess.CalledProcessError as e:
                raise RuntimeError(f"AWS command failed: {cmd}\n{e.stderr.strip()}") from e

        def list_s3_directories(prefix):
            """List directories (common prefixes) under S3 prefix"""
            cmd = f'aws s3api list-objects-v2 --bucket {bucket} --prefix {prefix} --delimiter / --query "CommonPrefixes[].Prefix" --output json'
            result = run_aws_command(cmd)
            return result or []

        def get_directory_age(prefix):
            """Get the oldest LastModified timestamp for objects in a directory"""
            cmd = f'aws s3api list-objects-v2 --bucket {bucket} --prefix {prefix} --query "sort_by(Contents, &LastModified)[0].LastModified" --output json'
            try:
                result = run_aws_command(cmd)
            except RuntimeError:
                return None
            if result:
                return datetime.fromisoformat(result.replace('Z', '+00:00'))
            return None

        def filter_old_resources(prefix, resource_type, cutoff_date, name_filters=None):
            """Find resources older than cutoff date under given prefix"""
            print(f"\n=== Scanning {resource_type} resources in s3://{bucket}/{prefix} ===")
            directories = list_s3_directories(prefix)

            if not directories:
                print(f"No directories found under {prefix}")
                return []

            print(f"Found {len(directories)} directories")
            old_resources = []

            for dir_path in directories:
                # Extract resource ID (directory name without trailing slash and prefix)
                resource_id = dir_path.rstrip('/').split('/')[-1]

                # Apply name filters if specified (match only if all filters match)
                if name_filters:
                    if not all(filter_str in resource_id for filter_str in name_filters):
                        print(f"  SKIP: {resource_id} (does not match all filters: {name_filters})")
                        continue

                # Get the age of the directory
                last_modified = get_directory_age(dir_path)

                if not last_modified:
                    print(f"  SKIP: {resource_id} (no objects found)")
                    continue

                age_hours = (datetime.now(timezone.utc) - last_modified).total_seconds() / 3600

                if last_modified < cutoff_date:
                    print(f"  MARK FOR CLEANUP: {resource_id} (age: {age_hours:.1f} hours, last modified: {last_modified.isoformat()})")
                    old_resources.append(resource_id)
                else:
                    print(f"  KEEP: {resource_id} (age: {age_hours:.1f} hours, last modified: {last_modified.isoformat()})")

            return old_resources

        def find_unassociated_eips():
            """Find old, unassociated Elastic IPs tagged as mapt-owned resources."""
            regions_cmd = (
                "aws ec2 describe-regions --all-regions "
                "--query 'Regions[].{name:RegionName,status:OptInStatus}' "
                "--output json"
            )
            region_details = run_aws_command(regions_cmd) or []
            regions = [
                region['name']
                for region in region_details
                if region.get('status') in ('opt-in-not-required', 'opted-in')
            ]
            cutoff = datetime.now(timezone.utc) - timedelta(hours=ttl_hours_eips)
            eips_to_release = []

            print(f"\n=== Scanning unassociated mapt Elastic IPs in {len(regions)} regions ===")
            for region in regions:
                cmd = (
                    f"aws ec2 describe-addresses --region {region} "
                    "--filters Name=tag:origin,Values=mapt "
                    "--query 'Addresses[].{AllocationId:AllocationId,AssociationId:AssociationId}' "
                    "--output json"
                )
                addresses = run_aws_command(cmd) or []
                for address in addresses:
                    allocation_id = address['AllocationId']
                    association_id = address.get('AssociationId')
                    allocation_details = find_eip_allocation_details(region, allocation_id)
                    eip_ref = f"{region}|{allocation_id}"
                    if allocation_details is None:
                        print(f"  SKIP {eip_ref}: allocation time is unknown")
                        continue

                    allocation_time, allocation_username = allocation_details
                    age_hours = (datetime.now(timezone.utc) - allocation_time).total_seconds() / 3600
                    if allocation_time <= cutoff:
                        if association_id:
                            print(
                                f"  KEEP {eip_ref}: associated with {association_id}; "
                                f"age: {age_hours:.1f} hours; allocated by {allocation_username} "
                                f"at {allocation_time.isoformat()}"
                            )
                        else:
                            print(f"  MARK FOR CLEANUP: {eip_ref} (age: {age_hours:.1f} hours, allocated by {allocation_username} at {allocation_time.isoformat()})")
                            eips_to_release.append(eip_ref)
                    elif association_id:
                        print(f"  KEEP {eip_ref}: associated with {association_id}; allocated by {allocation_username} at {allocation_time.isoformat()}, newer than {ttl_hours_eips} hours")
                    else:
                        print(f"  SKIP {eip_ref}: allocated by {allocation_username} at {allocation_time.isoformat()}, newer than {ttl_hours_eips} hours")

            if not eips_to_release:
                print("No old, unassociated mapt Elastic IPs found")
            return eips_to_release

        def find_eip_allocation_details(region, allocation_id):
            """Find an EIP's allocation time and username in CloudTrail."""
            cmd = (
                f"aws cloudtrail lookup-events --region {region} "
                f"--lookup-attributes AttributeKey=ResourceName,AttributeValue={allocation_id} "
                "--max-results 50 --output json"
            )
            try:
                event_data = run_aws_command(cmd) or {}
            except RuntimeError as error:
                print(f"  SKIP {region}|{allocation_id}: CloudTrail lookup failed: {error}")
                return None

            allocation_events = [
                event for event in event_data.get('Events', [])
                if event.get('EventName') == 'AllocateAddress'
                and event.get('EventSource') == 'ec2.amazonaws.com'
            ]
            if not allocation_events:
                return None

            event_time = allocation_events[0].get('EventTime')
            if not event_time:
                return None
            return (
                datetime.fromisoformat(event_time.replace('Z', '+00:00')),
                allocation_events[0].get('Username', 'unknown'),
            )

        # Main execution
        try:
            # Find old MAPT resources (VMs)
            rhel_resources = filter_old_resources('mapt/rhel/', 'RHEL', cutoff_date_vms)
            rhel_ai_resources = filter_old_resources('mapt/rhel-ai/', 'RHEL AI', cutoff_date_vms)
            fedora_resources = filter_old_resources('mapt/fedora/', 'Fedora', cutoff_date_vms)
            ocp_snc_resources = filter_old_resources('mapt/ocp-snc/', 'OCP SNC', cutoff_date_vms)

            # Find old cloud-importer resources (AMIs matching name filters)
            cloud_importer_resources = filter_old_resources('cloud-importer/', 'cloud-importer', cutoff_date_amis, name_filters=ami_name_filters)

            # Find unassociated Elastic IPs belonging to mapt. Untagged EIPs are
            # intentionally ignored so the pruner cannot release unrelated IPs.
            unassociated_eips = find_unassociated_eips()

            # Write results for pipeline to use
            print(f"\n=== Results ===")
            print(f"RHEL resources to cleanup: {rhel_resources}")
            print(f"RHEL AI resources to cleanup: {rhel_ai_resources}")
            print(f"Fedora resources to cleanup: {fedora_resources}")
            print(f"OCP SNC resources to cleanup: {ocp_snc_resources}")
            print(f"Cloud importer resources to cleanup: {cloud_importer_resources}")
            print(f"Unassociated mapt EIPs to cleanup: {unassociated_eips}")

            # Write results to Tekton results files (JSON arrays for array type results)
            with open('/tekton/results/rhel-resources', 'w') as f:
                f.write(json.dumps(rhel_resources))

            with open('/tekton/results/rhel-ai-resources', 'w') as f:
                f.write(json.dumps(rhel_ai_resources))

            with open('/tekton/results/fedora-resources', 'w') as f:
                f.write(json.dumps(fedora_resources))

            with open('/tekton/results/ocp-snc-resources', 'w') as f:
                f.write(json.dumps(ocp_snc_resources))

            with open('/tekton/results/aws-cloud-importer-resources', 'w') as f:
                f.write(json.dumps(cloud_importer_resources))

            with open('/tekton/results/unassociated-eips', 'w') as f:
                f.write(json.dumps(unassociated_eips))

            print("\n=== Task completed successfully ===")

        except Exception as e:
            print(f"\n=== ERROR: Task failed ===")
            print(f"Exception: {str(e)}")
            import traceback
            traceback.print_exc()
            sys.exit(1)
    - name: check-azure-blob
      image: quay.io/aipcc-cicd/cloud-importer:v0.0.4
      env:
        - name: AZURE_STORAGE_ACCOUNT
          valueFrom:
            secretKeyRef:
              name: $(params.secret-az-credentials)
              key: storage_account
              optional: true
        - name: AZURE_STORAGE_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.secret-az-credentials)
              key: storage_key
              optional: true
        - name: DRY_RUN
          value: $(params.dry-run)
        - name: TTL_HOURS_AZURE_IMAGES
          value: $(params.ttl-hours-azure-images)
      args:
        - $(params.image-name-filters[*])
      script: |
        #!/usr/bin/env python3
        import os
        import json
        import subprocess
        import sys
        from datetime import datetime, timezone, timedelta

        # Install azure-storage-blob to /tmp (container runs as non-root, /.local not writable)
        pip_target = '/tmp/pip-packages'
        subprocess.run(
            [sys.executable, '-m', 'pip', 'install', '-q', '--target', pip_target, 'azure-storage-blob'],
            check=True
        )
        sys.path.insert(0, pip_target)
        from azure.storage.blob import BlobServiceClient

        # Configuration
        azure_image_name_filters = sys.argv[1:]
        dry_run = os.environ['DRY_RUN'].lower() == 'true'
        storage_account = os.environ.get('AZURE_STORAGE_ACCOUNT', '')
        storage_key = os.environ.get('AZURE_STORAGE_KEY', '')

        if not storage_account or not storage_key:
            print("Azure credentials not provided, skipping Azure scan")
            with open('/tekton/results/azure-cloud-importer-resources', 'w') as f:
                f.write(json.dumps([]))
            sys.exit(0)
        ttl_hours = int(os.environ['TTL_HOURS_AZURE_IMAGES'])
        container_name = 'aipcc-productization'
        blob_prefix = 'cloud-importer/'

        cutoff_date = datetime.now(timezone.utc) - timedelta(hours=ttl_hours)

        print(f"\n=== Azure Resource Pruner Configuration ===")
        print(f"Storage Account: {storage_account}")
        print(f"Container: {container_name}")
        print(f"Blob Prefix: {blob_prefix}")
        print(f"Image Name Filters: {azure_image_name_filters}")
        print(f"TTL: {ttl_hours} hours ({ttl_hours / 24:.1f} days)")
        print(f"Cutoff date: {cutoff_date.isoformat()}")
        print(f"Dry run mode: {dry_run}")
        print("=" * 50)

        try:
            account_url = f"https://{storage_account}.blob.core.windows.net"
            client = BlobServiceClient(account_url=account_url, credential=storage_key)
            container_client = client.get_container_client(container_name)

            # List all blobs under the cloud-importer/ prefix and group by project name
            # Each project is stored at cloud-importer/<project-name>/.pulumi/...
            print(f"\n=== Scanning Azure Blob Storage: {container_name}/{blob_prefix} ===")
            blobs = list(container_client.list_blobs(name_starts_with=blob_prefix))

            if not blobs:
                print(f"No blobs found under {blob_prefix}")
                with open('/tekton/results/azure-cloud-importer-resources', 'w') as f:
                    f.write(json.dumps([]))
                sys.exit(0)

            # Group blobs by project name (first path segment after blob_prefix)
            # and track the oldest last-modified time per project (matching AWS behaviour)
            projects = {}
            for blob in blobs:
                # blob.name = "cloud-importer/<project-name>/.pulumi/..."
                relative = blob.name[len(blob_prefix):]
                if not relative:
                    continue
                project_name = relative.split('/')[0]
                if not project_name:
                    continue
                last_modified = blob.last_modified
                if last_modified and last_modified.tzinfo is None:
                    last_modified = last_modified.replace(tzinfo=timezone.utc)
                if project_name not in projects or (last_modified and last_modified < projects[project_name]):
                    projects[project_name] = last_modified

            print(f"Found {len(projects)} projects")

            old_resources = []
            for project_name, last_modified in projects.items():
                # Apply name filters (all must match)
                if azure_image_name_filters:
                    if not all(f in project_name for f in azure_image_name_filters):
                        print(f"  SKIP: {project_name} (does not match all filters: {azure_image_name_filters})")
                        continue

                if last_modified is None:
                    print(f"  SKIP: {project_name} (no modification time)")
                    continue

                age_hours = (datetime.now(timezone.utc) - last_modified).total_seconds() / 3600

                if last_modified < cutoff_date:
                    print(f"  MARK FOR CLEANUP: {project_name} (age: {age_hours:.1f} hours, last modified: {last_modified.isoformat()})")
                    old_resources.append(project_name)
                else:
                    print(f"  KEEP: {project_name} (age: {age_hours:.1f} hours, last modified: {last_modified.isoformat()})")

            print(f"\n=== Results ===")
            print(f"Azure cloud-importer resources to cleanup: {old_resources}")

            with open('/tekton/results/azure-cloud-importer-resources', 'w') as f:
                f.write(json.dumps(old_resources))

            print("\n=== Task completed successfully ===")

        except Exception as e:
            print(f"\n=== ERROR: Task failed ===")
            print(f"Exception: {str(e)}")
            import traceback
            traceback.print_exc()
            sys.exit(1)
