kind: Task
apiVersion: tekton.dev/v1
metadata:
  name: check-ami-exists
spec:
  params:
    - name: git-digest
      default: "not-provided"
      description: Git commit digest to use in AMI name
    - name: event-type
      default: "not-provided"
      description: Event type (e.g., pull_request, merge_request, push)
    - name: rhel-ai-version
      description: RHEL AI version for AMI naming
    - name: release-mode
      description: If true, omit git digest from AMI name for release uploads
      default: "false"
    - name: secret-aws-credentials
      description: Name of the secret containing AWS credentials
      default: aws-konflux-tests
  results:
    - name: ami-exists
      description: true if AMI exists, false otherwise
    - name: ami-name
      description: Expected AMI name based on git digest and event type
  steps:
    - name: check-ami
      image: ghcr.io/mapt-oss/cloud-importer@sha256:0eff2e8f9208131a18a4a9dab37831e665b38567e586b55a6cdb51b7ba9d9fc2
      env:
        - name: GIT_DIGEST
          value: $(params.git-digest)
        - name: HOME
          value: /opt/cloud-importer/run
        - name: EVENT_TYPE
          value: $(params.event-type)
        - name: RHEL_AI_VERSION
          value: $(params.rhel-ai-version)
        - name: RELEASE_MODE
          value: $(params.release-mode)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: $(params.secret-aws-credentials)
              key: access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.secret-aws-credentials)
              key: secret-key
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: $(params.secret-aws-credentials)
              key: region
      script: |
        #!/bin/bash
        set -e

        # Shorten git digest to 8 characters
        SHORT_DIGEST="${GIT_DIGEST:0:8}"

        # Convert event type to lowercase
        EVENT_TYPE_LOWER=$(echo "${EVENT_TYPE}" | tr '[:upper:]' '[:lower:]')

        # Construct AMI name based on release mode or event type
        # mapt has two parameters for choosing the AMI name
        # 1. version - e.g. for "3.2.0" mapt will search for "rhel-ai-cuda-aws-3.2.0*" and returns the most recent AMI
        # 2. custom-image - e.g. "test-rhel-ai-cuda-aws-3.2.0-pr-12345678"
        # we need "test-" prefix for custom-image to avoid conflicts with the version search
        
        if [[ "${RELEASE_MODE}" == "true" ]]; then
          # Release mode: clean version only (no git digest)
          AMI_NAME="rhel-ai-cuda-aws-${RHEL_AI_VERSION}"
        elif [[ "${EVENT_TYPE_LOWER}" == "pull_request" || "${EVENT_TYPE_LOWER}" == "merge_request" ]]; then
          # Test mode (merge request): version with -pr- prefix and git digest
          AMI_NAME="test-rhel-ai-cuda-aws-${RHEL_AI_VERSION}-pr-${SHORT_DIGEST}"
        else
          # Test mode (commit): version with git digest
          AMI_NAME="test-rhel-ai-cuda-aws-${RHEL_AI_VERSION}-${SHORT_DIGEST}"
        fi

        echo -e "\n=== Looking for AMI with name '${AMI_NAME}' in region '${AWS_DEFAULT_REGION}' ==="

        # Query AWS for AMI with this name
        AMI_ID=$(aws ec2 describe-images \
          --owners self \
          --filters "Name=tag:Name,Values=${AMI_NAME}" \
          --query 'Images[0].ImageId' \
          --output text 2>/dev/null || echo "None")

        if [[ "${AMI_ID}" != "None" && -n "${AMI_ID}" ]]; then
          echo -e "\n=== AMI ${AMI_NAME} found ==="
          echo -n "true" > $(results.ami-exists.path)
        else
          echo -e "\n=== AMI ${AMI_NAME} not found ==="
          echo -n "false" > $(results.ami-exists.path)
        fi

        echo -n "${AMI_NAME}" > $(results.ami-name.path)
